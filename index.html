<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Briefing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ── Reset ────────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* ── Tokens ───────────────────────────────────────────────────────── */
:root {
  --bg:    #f5f3ee;
  --bg2:   #ffffff;
  --ink:   #1a1816;
  --ink2:  #6b6660;
  --ink3:  #a39e95;
  --line:  rgba(26,24,22,0.08);
  --green: #1f8a5b;
  --red:   #c0392b;
  --sun:   #e89a2f;
  --cup-accent: #2a6fdb;
  --f-s: 'Geist', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
  --f-m: 'Geist Mono', ui-monospace, monospace;
}

/* ── Base ─────────────────────────────────────────────────────────── */
html { scroll-behavior: smooth; }
body {
  font-family: var(--f-s);
  background: var(--bg);
  color: var(--ink);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* ── Layout ───────────────────────────────────────────────────────── */
.wrap {
  max-width: 1320px;
  margin: 0 auto;
  padding: 28px 36px 56px;
  display: grid;
  grid-template-columns: repeat(12, 1fr);
  gap: 14px;
}

/* ── Card ─────────────────────────────────────────────────────────── */
.card {
  background: var(--bg2);
  border-radius: 22px;
  box-shadow: 0 1px 2px rgba(26,24,22,0.04), 0 4px 14px rgba(26,24,22,0.04);
  transition: transform .26s cubic-bezier(.2,.7,.3,1), box-shadow .26s;
  position: relative;
}
.card.hover-lift:hover {
  transform: translateY(-4px);
  box-shadow: 0 18px 40px rgba(26,24,22,0.12), 0 4px 10px rgba(26,24,22,0.05);
}
.card.hover-lift:active {
  transform: translateY(-1px) scale(0.997);
}

/* ── Eyebrow ──────────────────────────────────────────────────────── */
.eyebrow {
  font-family: var(--f-s);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 1.6px;
  text-transform: uppercase;
  color: var(--ink3);
  margin-bottom: 14px;
}

/* ── Animations ───────────────────────────────────────────────────── */
@keyframes cup-fade-up {
  from { opacity: 0; transform: translate3d(0, 16px, 0); }
  to   { opacity: 1; transform: translate3d(0, 0, 0); }
}
@keyframes cup-pulse {
  0%, 100% { transform: scale(1); }
  50%       { transform: scale(1.04); }
}
@keyframes cup-spin {
  from { transform: rotate(0deg); }
  to   { transform: rotate(360deg); }
}
@keyframes cup-shimmer {
  0%   { background-position: -200% 0; }
  100% { background-position: 200% 0; }
}

.cup-reveal {
  opacity: 0;
  will-change: opacity, transform;
}
.cup-reveal.is-in {
  animation: cup-fade-up 620ms cubic-bezier(.2,.7,.25,1) forwards;
}

/* ── Row hover ────────────────────────────────────────────────────── */
.cup-row {
  transition: background .18s ease, transform .18s cubic-bezier(.2,.7,.3,1);
  border-radius: 8px;
}
.cup-row:hover {
  background: rgba(26,24,22,0.035);
  transform: translateX(3px);
}

/* ── Press effect ─────────────────────────────────────────────────── */
.cup-press {
  transition: transform .14s cubic-bezier(.2,.7,.3,1);
  cursor: pointer;
}
.cup-press:active { transform: scale(0.97); }

/* ── Skeleton ─────────────────────────────────────────────────────── */
.skel {
  background: linear-gradient(90deg, rgba(26,24,22,0.06) 25%, rgba(26,24,22,0.10) 50%, rgba(26,24,22,0.06) 75%);
  background-size: 200% 100%;
  animation: cup-shimmer 1.6s ease-in-out infinite;
  border-radius: 10px;
}

/* ── Chip ─────────────────────────────────────────────────────────── */
.pct-chip {
  font-family: var(--f-m);
  font-size: 12px;
  font-weight: 500;
  padding: 2px 8px;
  border-radius: 99px;
  font-variant-numeric: tabular-nums;
}
.pct-chip.up   { color: var(--green); background: rgba(31,138,91,0.10); }
.pct-chip.down { color: var(--red);   background: rgba(192,57,43,0.10); }

/* ════════════════════════════════════════════════════════════════════
   HERO
   ════════════════════════════════════════════════════════════════════ */
#hero-card {
  padding: 0;
  overflow: hidden;
  grid-column: 1 / -1;
  transition: background 1.2s ease;
}
.hero-blob1, .hero-blob2 {
  position: absolute;
  border-radius: 50%;
  pointer-events: none;
  will-change: transform;
  transition: background 1.2s ease;
}
.hero-blob1 {
  width: 500px; height: 500px;
  top: -160px; right: -120px;
  background: radial-gradient(circle, rgba(232,154,47,0.45), transparent 65%);
}
.hero-blob2 {
  width: 340px; height: 340px;
  bottom: -120px; left: -80px;
  background: radial-gradient(circle, rgba(42,111,219,0.28), transparent 65%);
}
.hero-inner {
  position: relative;
  display: flex;
  justify-content: space-between;
  align-items: stretch;
  gap: 0;
  min-height: 160px;
}
.hero-left {
  flex: 1;
  padding: 28px 32px;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.hero-date {
  font-family: var(--f-s);
  font-size: 13px;
  color: var(--ink2);
  letter-spacing: 0.2px;
}
.hero-h1 {
  margin: 10px 0 0;
  font-family: var(--f-s);
  font-size: clamp(30px, 3.5vw, 44px);
  font-weight: 600;
  color: var(--ink);
  letter-spacing: -1.5px;
  line-height: 1;
  max-width: 680px;
}
.hero-h1 em {
  color: var(--cup-accent);
  font-style: italic;
  font-weight: 500;
}
.hero-summary {
  font-family: var(--f-s);
  font-size: 16px;
  color: var(--ink2);
  line-height: 1.5;
  margin-top: 14px;
  max-width: 520px;
}

/* Weather panel — right side, separated with a subtle divider */
.hero-weather-panel {
  flex-shrink: 0;
  width: 260px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: flex-end;
  padding: 24px 28px 24px 20px;
  border-left: 1px solid var(--line);
  position: relative;
  gap: 2px;
}
.hero-weather-icon-wrap {
  position: relative;
  width: 64px; height: 64px;
  margin-bottom: 8px;
  flex-shrink: 0;
}
.hero-weather-icon-wrap svg {
  width: 64px; height: 64px;
}
.hero-temp-row {
  display: flex;
  align-items: baseline;
  gap: 6px;
}
.hero-temp {
  font-family: var(--f-s);
  font-size: 80px;
  font-weight: 200;
  color: var(--ink);
  line-height: 1;
  letter-spacing: -4px;
  font-variant-numeric: tabular-nums;
}
.hero-deg {
  font-size: 28px;
  font-weight: 300;
  color: var(--ink2);
  letter-spacing: -1px;
  margin-bottom: 6px;
}
.hero-condition {
  font-family: var(--f-s);
  font-size: 14px;
  color: var(--ink2);
  font-weight: 500;
  text-align: right;
}
.hero-hl {
  font-family: var(--f-m);
  font-size: 11px;
  color: var(--ink3);
  margin-top: 3px;
  letter-spacing: 0.3px;
  text-align: right;
}
/* Weather pill strips */
.hero-weather-pills {
  display: flex;
  gap: 6px;
  margin-top: 8px;
  flex-wrap: wrap;
  justify-content: flex-end;
}
.hero-wpill {
  font-family: var(--f-m);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.4px;
  padding: 3px 8px;
  border-radius: 99px;
  background: rgba(26,24,22,0.06);
  color: var(--ink2);
}

/* ════════════════════════════════════════════════════════════════════
   PORTFOLIO STRIP
   ════════════════════════════════════════════════════════════════════ */
#portfolio-strip { padding: 22px 24px; cursor: default; grid-column: span 7; }
.port-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.port-total-hint { font-size: 11px; color: var(--ink3); font-family: var(--f-s); }
.port-fund-chips { display: flex; gap: 10px; }
.port-fund-chip {
  flex: 1; padding: 10px 14px; border-radius: 12px;
  background: rgba(26,24,22,0.035);
  display: flex; flex-direction: column; gap: 3px;
  transition: background 0.2s;
}
#portfolio-strip:hover .port-fund-chip { background: rgba(26,24,22,0.055); }
.port-fund-name { font-size: 12px; font-weight: 600; color: var(--ink2); }
.port-fund-pct {
  font-family: var(--f-m); font-size: 15px; font-weight: 600;
  font-variant-numeric: tabular-nums;
}
.port-fund-pct.up { color: var(--green); }
.port-fund-pct.down { color: var(--red); }

.port-detail-expand {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.4s cubic-bezier(.2,.7,.25,1);
}
#portfolio-strip:hover .port-detail-expand,
#portfolio-strip.expanded .port-detail-expand { max-height: 200px; }
.port-detail-inner {
  border-top: 1px solid var(--line);
  margin-top: 14px;
  padding-top: 14px;
}
.port-detail-row {
  display: grid;
  grid-template-columns: 1fr 60px 80px 90px;
  align-items: center;
  padding: 5px 0;
  font-size: 13px;
  color: var(--ink2);
  gap: 8px;
}
.port-detail-row:last-child { border-bottom: 1px solid var(--line); padding-bottom: 10px; margin-bottom: 6px; }
.port-detail-fund { font-weight: 600; color: var(--ink); }
.port-detail-units { font-family: var(--f-m); font-size: 11px; color: var(--ink3); text-align: right; }
.port-detail-price { font-family: var(--f-m); font-size: 12px; text-align: right; }
.port-detail-val { font-family: var(--f-m); font-size: 13px; font-weight: 600; text-align: right; color: var(--ink); }
.port-total-row {
  display: flex; justify-content: space-between; align-items: center;
  font-size: 13px;
}
.port-total-label { color: var(--ink3); font-size: 11px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; }
.port-total-value { font-family: var(--f-m); font-size: 16px; font-weight: 600; color: var(--ink); }

/* ════════════════════════════════════════════════════════════════════
   MARKETS
   ════════════════════════════════════════════════════════════════════ */
#markets-card {
  padding: 24px 28px;
  grid-column: span 7;
}
.markets-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px 20px;
}
.market-cell {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.market-name {
  font-family: var(--f-s);
  font-size: 12px;
  color: var(--ink3);
  letter-spacing: 0.4px;
  text-transform: uppercase;
}
.market-value-row {
  display: flex;
  align-items: baseline;
  gap: 10px;
}
.market-value {
  font-family: var(--f-s);
  font-size: 22px;
  font-weight: 600;
  color: var(--ink);
  letter-spacing: -0.5px;
  font-variant-numeric: tabular-nums;
}

/* ════════════════════════════════════════════════════════════════════
   FIXTURES
   ════════════════════════════════════════════════════════════════════ */
#fixtures-card {
  padding: 24px 28px;
  grid-column: span 8;
  align-self: start;
}
#golf-card { align-self: start; }
.fixtures-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 18px;
}
.fixtures-subtitle {
  font-family: var(--f-s);
  font-size: 12px;
  color: var(--ink3);
}
.fixtures-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.fixture-chip {
  padding: 14px 16px;
  border-radius: 14px;
  background: rgba(26,24,22,0.025);
  border: 1px solid transparent;
  cursor: pointer;
  transition: background .22s, border-color .22s, transform .14s cubic-bezier(.2,.7,.3,1);
  user-select: none;
}
.fixture-chip:hover {
  background: rgba(26,24,22,0.05);
}
.fixture-chip.is-open {
  background: rgba(42,111,219,0.06);
  border-color: rgba(42,111,219,0.25);
}
.fixture-chip-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.fixture-teams {
  display: flex;
  flex-direction: column;
  gap: 3px;
}
.fixture-team-name {
  font-family: var(--f-s);
  font-size: 14px;
  color: var(--ink);
}
.fixture-team-name.fav { font-weight: 600; }
.fixture-meta {
  text-align: right;
  flex-shrink: 0;
}
.fixture-time {
  font-family: var(--f-m);
  font-size: 11px;
  color: var(--ink3);
  margin-bottom: 3px;
}
.fixture-odds-row {
  font-family: var(--f-m);
  font-size: 11px;
  color: var(--ink3);
  display: flex;
  gap: 5px;
  justify-content: flex-end;
}
.fixture-odds-row .fav-odd { color: var(--cup-accent); }
.fixture-score { font-family: var(--f-m); font-size: 14px; font-weight: 700; color: var(--ink); letter-spacing: -0.5px; }
.fixture-badge { width: 18px; height: 18px; object-fit: contain; flex-shrink: 0; }
.fixture-expand {
  display: grid;
  grid-template-rows: 0fr;
  transition: grid-template-rows .32s cubic-bezier(.2,.7,.25,1);
}
.fixture-expand.open { grid-template-rows: 1fr; }
.fixture-expand-inner {
  overflow: hidden;
}
.fixture-expand-body {
  padding-top: 10px;
  margin-top: 10px;
  border-top: 1px solid rgba(26,24,22,0.06);
  font-family: var(--f-s);
  font-size: 12px;
  color: var(--ink2);
  line-height: 1.6;
}
.fixture-expand-row {
  display: flex;
  justify-content: space-between;
  margin-bottom: 2px;
}

/* ════════════════════════════════════════════════════════════════════
   WORLD CUP FIXTURES
   ════════════════════════════════════════════════════════════════════ */
#wc-fixtures-card { padding: 24px 28px; }

.wc-england-hero {
  background: linear-gradient(135deg, rgba(42,111,219,0.07), rgba(42,111,219,0.02));
  border: 1px solid rgba(42,111,219,0.20);
  border-radius: 16px;
  padding: 16px 20px;
  margin-bottom: 16px;
}
.wc-england-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-family: var(--f-m);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.8px;
  text-transform: uppercase;
  padding: 3px 10px;
  border-radius: 99px;
  margin-bottom: 10px;
}
.wc-england-badge.live     { background: rgba(192,57,43,0.12); color: var(--red); }
.wc-england-badge.today    { background: rgba(42,111,219,0.12); color: var(--cup-accent); }
.wc-england-badge.upcoming { background: rgba(26,24,22,0.06); color: var(--ink3); }
.wc-england-badge.ft       { background: rgba(31,138,91,0.10); color: var(--green); }
.wc-hero-teams {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 8px;
  flex-wrap: wrap;
}
.wc-hero-flag {
  width: 36px; height: 36px;
  border-radius: 6px;
  object-fit: cover;
  flex-shrink: 0;
}
.wc-hero-flag-fb {
  width: 36px; height: 36px;
  border-radius: 6px;
  background: rgba(26,24,22,0.08);
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; flex-shrink: 0;
}
.wc-hero-vs { font-family: var(--f-m); font-size: 11px; color: var(--ink3); }
.wc-hero-score {
  font-family: var(--f-s);
  font-size: 26px;
  font-weight: 700;
  color: var(--ink);
  letter-spacing: -1px;
  font-variant-numeric: tabular-nums;
  margin-left: auto;
}
.wc-hero-team-name { font-family: var(--f-s); font-size: 15px; font-weight: 600; color: var(--ink); }
.wc-hero-meta { font-family: var(--f-m); font-size: 11px; color: var(--ink3); margin-top: 4px; }
.wc-hero-time { font-family: var(--f-m); font-size: 12px; color: var(--ink2); margin-top: 2px; }
.wc-hero-prob { font-family: var(--f-m); font-size: 11px; color: var(--ink3); margin-top: 6px; }
.wc-hero-prob .prob-hi { color: var(--cup-accent); font-weight: 600; }

.wc-round-label {
  font-family: var(--f-s);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 1.2px;
  text-transform: uppercase;
  color: var(--ink3);
  margin-bottom: 10px;
}
.wc-scroll-wrap {
  display: flex;
  gap: 10px;
  overflow-x: auto;
  padding-bottom: 6px;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.wc-scroll-wrap::-webkit-scrollbar { display: none; }
.wc-chip {
  flex-shrink: 0;
  width: 156px;
  padding: 12px 14px;
  border-radius: 14px;
  background: rgba(26,24,22,0.025);
  border: 1px solid transparent;
  cursor: pointer;
  transition: background .2s, border-color .2s;
  user-select: none;
}
.wc-chip:hover { background: rgba(26,24,22,0.05); }
.wc-chip.is-open { background: rgba(42,111,219,0.06); border-color: rgba(42,111,219,0.22); }
.wc-chip-flags { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
.wc-chip-flag { width: 22px; height: 22px; border-radius: 4px; object-fit: cover; }
.wc-chip-flag-fb {
  width: 22px; height: 22px; border-radius: 4px;
  background: rgba(26,24,22,0.08);
  display: flex; align-items: center; justify-content: center; font-size: 14px;
}
.wc-chip-vs { font-family: var(--f-m); font-size: 10px; color: var(--ink3); }
.wc-chip-teams {
  font-family: var(--f-s); font-size: 12px; font-weight: 600; color: var(--ink);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.wc-chip-time { font-family: var(--f-m); font-size: 10px; color: var(--ink3); margin-top: 3px; }
.wc-chip-score {
  font-family: var(--f-m); font-size: 13px; font-weight: 700;
  color: var(--ink); margin-top: 2px; letter-spacing: -0.3px;
}
.wc-chip-odds { display: flex; gap: 4px; margin-top: 3px; font-family: var(--f-m); font-size: 10px; color: var(--ink3); }
.wc-chip-odds .fav-odd { color: var(--cup-accent); font-weight: 600; }
.wc-chip-expand { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .28s cubic-bezier(.2,.7,.25,1); }
.wc-chip-expand.open { grid-template-rows: 1fr; }
.wc-chip-expand-inner { overflow: hidden; }
.wc-chip-expand-body {
  padding-top: 8px; margin-top: 8px;
  border-top: 1px solid rgba(26,24,22,0.06);
  font-family: var(--f-s); font-size: 11px; color: var(--ink2); line-height: 1.6;
}

/* ════════════════════════════════════════════════════════════════════
   WC FANTASY INSIGHTS
   ════════════════════════════════════════════════════════════════════ */
#wc-fantasy-card { padding: 22px 24px; }
.wc-fantasy-section-label {
  font-family: var(--f-s);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1.2px;
  text-transform: uppercase;
  color: var(--ink3);
  margin: 14px 0 8px;
}
.wc-fantasy-section-label:first-child { margin-top: 0; }
.wc-fantasy-row {
  display: flex;
  align-items: center;
  padding: 5px 6px;
  border-bottom: 1px solid var(--line);
  border-radius: 6px;
}
.wc-fantasy-row:last-child { border-bottom: none; }
.wc-fantasy-rank { font-family: var(--f-m); font-size: 11px; color: var(--ink3); width: 16px; flex-shrink: 0; }
.wc-fantasy-name {
  font-family: var(--f-s); font-size: 13px; color: var(--ink); font-weight: 500;
  flex: 1; padding: 0 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.wc-fantasy-squad {
  font-family: var(--f-m); font-size: 10px; color: var(--ink3);
  background: rgba(26,24,22,0.05); padding: 2px 6px; border-radius: 99px; flex-shrink: 0;
}
.wc-fantasy-val {
  font-family: var(--f-m); font-size: 12px; font-weight: 600; color: var(--ink);
  margin-left: 8px; flex-shrink: 0; font-variant-numeric: tabular-nums;
}
.wc-fantasy-val.green { color: var(--green); }

/* ════════════════════════════════════════════════════════════════════
   SPOTIFY
   ════════════════════════════════════════════════════════════════════ */
#spotify-card { padding: 22px 24px; }
.sp-section-label {
  font-family: var(--f-m);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1.2px;
  text-transform: uppercase;
  color: var(--ink3);
  margin-bottom: 10px;
}
.sp-live-dot {
  display: inline-block;
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--green);
  margin-right: 5px;
  vertical-align: middle;
  animation: cup-pulse 1.8s ease-in-out infinite;
}
.sp-row {
  display: flex;
  align-items: center;
  gap: 12px;
  text-decoration: none;
  color: inherit;
  transition: opacity .18s;
  padding: 2px 0;
}
.sp-row:hover { opacity: 0.75; }
.sp-art {
  width: 48px; height: 48px;
  border-radius: 8px;
  object-fit: cover;
  flex-shrink: 0;
  background: rgba(26,24,22,0.06);
}
.sp-art-sm {
  width: 36px; height: 36px;
  border-radius: 6px;
  object-fit: cover;
  flex-shrink: 0;
  background: rgba(26,24,22,0.06);
}
.sp-info { flex: 1; min-width: 0; }
.sp-title {
  font-family: var(--f-s);
  font-size: 14px;
  font-weight: 600;
  color: var(--ink);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.sp-title.sm { font-size: 13px; }
.sp-sub {
  font-family: var(--f-s);
  font-size: 12px;
  color: var(--ink2);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-top: 2px;
}
.sp-divider { border: none; border-top: 1px solid var(--line); margin: 12px 0; }
.sp-unavailable { font-family: var(--f-s); font-size: 13px; color: var(--ink3); padding: 8px 0; }

/* ════════════════════════════════════════════════════════════════════
   CALENDAR
   ════════════════════════════════════════════════════════════════════ */
#calendar-card { padding: 22px 24px; }
.cal-item {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 9px 0;
  border-bottom: 1px solid var(--line);
  transition: padding-left .18s;
}
.cal-item:last-child { border-bottom: none; }
.cal-item:hover { padding-left: 6px; }
.cal-emoji { font-size: 18px; line-height: 1.4; flex-shrink: 0; }
.cal-text { font-family: var(--f-s); font-size: 14px; color: var(--ink); line-height: 1.5; }
.cal-empty { font-family: var(--f-s); font-size: 14px; color: var(--ink3); padding: 12px 0; }

/* ════════════════════════════════════════════════════════════════════
   GOLF
   ════════════════════════════════════════════════════════════════════ */
#golf-card {
  padding: 22px 24px;
  grid-column: span 5;
  align-self: start;
}

/* Placeholder rules for new sections — filled in by Tasks 4–7 */
#wc-fixtures-card  { grid-column: span 8; align-self: start; }
#wc-fantasy-card   { grid-column: span 4; align-self: start; }
#calendar-card     { grid-column: span 5; align-self: start; }
#spotify-card      { grid-column: span 4; align-self: stretch; }
.golf-two-col {
  display: grid;
  grid-template-columns: 1fr;
  gap: 14px;
}
/* Next tee panel */
.golf-next-panel {
  background: linear-gradient(135deg, rgba(31,138,91,0.06), rgba(31,138,91,0.02));
  border: 1px solid rgba(31,138,91,0.18);
  border-radius: 16px;
  padding: 18px 22px;
  position: relative;
  overflow: hidden;
}
.golf-pin-svg {
  position: absolute;
  top: 14px; right: 14px;
  width: 38px;
  opacity: 0.16;
  pointer-events: none;
}
.golf-next-eyebrow {
  font-family: var(--f-s);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.4px;
  text-transform: uppercase;
  color: var(--green);
  margin-bottom: 8px;
}
.golf-course-name {
  font-family: var(--f-s);
  font-size: 22px;
  font-weight: 600;
  color: var(--ink);
  letter-spacing: -0.4px;
  line-height: 1.1;
  margin-bottom: 6px;
  padding-right: 36px;
}
.golf-datetime-row {
  display: flex;
  align-items: baseline;
  gap: 10px;
  margin-bottom: 14px;
  flex-wrap: wrap;
}
.golf-date {
  font-family: var(--f-s);
  font-size: 15px;
  color: var(--ink2);
}
.golf-time {
  font-family: var(--f-s);
  font-size: 22px;
  font-weight: 600;
  color: var(--green);
  letter-spacing: -0.4px;
}
.golf-holes {
  font-family: var(--f-m);
  font-size: 12px;
  color: var(--ink3);
  margin-left: auto;
}
.golf-book-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 16px;
  background: var(--green);
  color: #fff;
  border-radius: 99px;
  font-family: var(--f-s);
  font-size: 13px;
  font-weight: 600;
  text-decoration: none;
  transition: opacity .2s;
}
.golf-book-btn:hover { opacity: 0.88; }
/* Hot deal badge */
.golf-hot-badge {
  display: inline-block;
  background: rgba(192,57,43,0.10);
  color: var(--red);
  font-family: var(--f-m);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.8px;
  text-transform: uppercase;
  padding: 3px 10px;
  border-radius: 99px;
  margin-bottom: 8px;
}
/* Right: upcoming */
.golf-upcoming-eyebrow {
  font-family: var(--f-s);
  font-size: 11px;
  color: var(--ink3);
  letter-spacing: 0.4px;
  text-transform: uppercase;
  margin-bottom: 10px;
}
.golf-upcoming-row {
  padding: 8px 10px;
  margin: 0 -10px;
  border-radius: 8px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  cursor: pointer;
  text-decoration: none;
  color: inherit;
}
.golf-upcoming-course {
  font-family: var(--f-s);
  font-size: 13px;
  color: var(--ink);
  font-weight: 500;
}
.golf-upcoming-meta {
  font-family: var(--f-m);
  font-size: 11px;
  color: var(--ink3);
  margin-top: 1px;
}
.golf-upcoming-time {
  font-family: var(--f-s);
  font-size: 16px;
  font-weight: 600;
  color: var(--ink2);
  letter-spacing: -0.2px;
}
.golf-upcoming-price {
  font-family: var(--f-m);
  font-size: 13px;
  font-weight: 600;
  color: var(--green);
}
.golf-stale {
  font-family: var(--f-m);
  font-size: 11px;
  color: var(--ink3);
  margin-top: 12px;
}
.golf-empty {
  font-family: var(--f-s);
  font-size: 14px;
  color: var(--ink3);
  padding: 16px 0;
}

/* ════════════════════════════════════════════════════════════════════
   HEADLINES EDITORIAL
   ════════════════════════════════════════════════════════════════════ */
#headlines-card {
  padding: 22px 28px 20px;
  grid-column: span 8;
}
.hl-masthead {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 18px;
  gap: 12px;
}
.hl-masthead-title {
  font-family: var(--f-s);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 1.6px;
  text-transform: uppercase;
  color: var(--ink3);
  flex-shrink: 0;
}
.hl-tabs {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
  justify-content: flex-end;
}
.hl-tab {
  padding: 4px 12px;
  border-radius: 99px;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.2px;
  color: var(--ink3);
  background: transparent;
  border: 1px solid transparent;
  cursor: pointer;
  transition: color 0.18s, background 0.18s, border-color 0.18s;
  font-family: var(--f-s);
}
.hl-tab:hover { color: var(--ink); background: rgba(26,24,22,0.04); }
.hl-tab.active {
  color: var(--ink);
  background: rgba(26,24,22,0.07);
  border-color: rgba(26,24,22,0.12);
}
#hl-carousel {
  position: relative;
  min-height: 300px;
}
.hl-slide {
  position: absolute;
  inset: 0;
  opacity: 0;
  transition: opacity 0.45s ease;
  pointer-events: none;
}
.hl-slide.active {
  opacity: 1;
  pointer-events: auto;
  position: relative;
}
.hl-items {
  display: flex;
  flex-direction: column;
}
.hl-item {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 13px 0;
  border-bottom: 1px solid var(--line);
  text-decoration: none;
  color: inherit;
  transition: padding-left 0.18s;
}
.hl-item:last-child { border-bottom: none; }
.hl-item:hover { padding-left: 8px; }
.hl-item-meta {
  font-family: var(--f-m);
  font-size: 11px;
  letter-spacing: 0.8px;
  text-transform: uppercase;
  line-height: 1;
}
.hl-item-title {
  font-size: 17px;
  font-weight: 600;
  color: var(--ink);
  line-height: 1.35;
  transition: color 0.15s;
}
.hl-item.featured .hl-item-title {
  font-size: 19px;
  font-weight: 700;
}
.hl-item:hover .hl-item-title { opacity: 0.78; }
.hl-item-desc {
  font-size: 14px;
  color: var(--ink2);
  line-height: 1.5;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.hl-more-wrap {
  display: flex;
  flex-direction: column;
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.42s cubic-bezier(.2,.7,.25,1);
}
.hl-more-wrap.open { max-height: 800px; }
.hl-view-more {
  margin-top: 10px;
  font-family: var(--f-s);
  font-size: 13px;
  font-weight: 600;
  color: var(--ink3);
  background: none;
  border: none;
  cursor: pointer;
  padding: 4px 0;
  text-align: left;
  transition: color 0.15s;
}
.hl-view-more:hover { color: var(--ink); }

/* ════════════════════════════════════════════════════════════════════
   COMPANIES FEATURED CAROUSEL
   ════════════════════════════════════════════════════════════════════ */
#companies-card {
  padding: 22px 28px 20px;
  grid-column: 1 / -1;
}
.co-masthead {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 4px;
}
.co-counter {
  font-family: var(--f-m);
  font-size: 12px;
  color: var(--ink3);
}
.co-featured {
  padding: 20px 0 16px;
  border-bottom: 1px solid var(--line);
  transition: opacity 0.35s ease, transform 0.35s ease;
}
.co-featured.fading {
  opacity: 0;
  transform: translateY(10px);
}
.co-featured-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 24px;
  margin-bottom: 10px;
}
.co-featured-left { flex: 1; }
.co-featured-name {
  font-size: 44px;
  font-weight: 700;
  letter-spacing: -2px;
  line-height: 1;
  color: var(--ink);
}
.co-featured-tag {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.8px;
  text-transform: uppercase;
  color: var(--ink3);
  margin-top: 8px;
}
.co-featured-right {
  text-align: right;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 6px;
}
/* Logo container */
.co-logo-box {
  width: 72px; height: 72px;
  border-radius: 16px;
  background: rgba(26,24,22,0.04);
  border: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  flex-shrink: 0;
}
.co-logo-box img {
  width: 56px; height: 56px;
  object-fit: contain;
}
.co-logo-box .co-logo-fb {
  font-family: var(--f-s);
  font-size: 20px;
  font-weight: 700;
  color: var(--ink2);
}
.co-featured-pct {
  font-family: var(--f-m);
  font-size: 32px;
  font-weight: 600;
  letter-spacing: -1px;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}
.co-featured-pct.up   { color: var(--green); }
.co-featured-pct.down { color: var(--red); }
.co-featured-price {
  font-family: var(--f-m);
  font-size: 12px;
  color: var(--ink3);
}
/* Website link */
.co-visit-link {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-family: var(--f-s);
  font-size: 12px;
  font-weight: 600;
  color: var(--cup-accent);
  text-decoration: none;
  padding: 5px 12px;
  border-radius: 99px;
  border: 1.5px solid rgba(42,111,219,0.3);
  background: rgba(42,111,219,0.05);
  transition: background 0.18s, border-color 0.18s, transform 0.14s;
  margin-top: 4px;
}
.co-visit-link:hover {
  background: rgba(42,111,219,0.12);
  border-color: rgba(42,111,219,0.5);
  transform: translateY(-1px);
}
.co-visit-link svg {
  transition: transform 0.18s;
}
.co-visit-link:hover svg { transform: translate(1px, -1px); }
.co-featured-desc {
  font-size: 17px;
  color: var(--ink2);
  line-height: 1.5;
  max-width: 660px;
}
.co-nav {
  display: flex;
  gap: 7px;
  align-items: center;
  padding-top: 14px;
}
.co-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: rgba(26,24,22,0.15);
  cursor: pointer;
  border: 0; padding: 0;
  transition: background 0.2s, transform 0.2s;
  flex-shrink: 0;
}
.co-dot.active {
  background: var(--cup-accent);
  transform: scale(1.3);
}

/* ════════════════════════════════════════════════════════════════════
   PAGE SHINE OVERLAY
   ════════════════════════════════════════════════════════════════════ */
#page-shine {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 9999;
  overflow: hidden;
}
@keyframes shine-sweep {
  0%   { transform: translateX(-100%) skewX(-12deg); }
  100% { transform: translateX(400%) skewX(-12deg); }
}
#page-shine::after {
  content: '';
  position: absolute;
  top: 0; left: 0;
  width: 30%;
  height: 100%;
  background: linear-gradient(
    90deg,
    transparent 0%,
    rgba(255,255,255,0.00) 30%,
    rgba(255,255,255,0.08) 46%,
    rgba(255,255,255,0.18) 50%,
    rgba(255,255,255,0.08) 54%,
    rgba(255,255,255,0.00) 70%,
    transparent 100%
  );
  transform: translateX(-100%) skewX(-12deg);
}
#page-shine.sweeping::after {
  animation: shine-sweep 1.3s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
}

/* ════════════════════════════════════════════════════════════════════
   FOOTER
   ════════════════════════════════════════════════════════════════════ */
.brief-footer {
  font-family: var(--f-s);
  font-size: 12px;
  color: var(--ink3);
  text-align: center;
  padding: 18px 0;
  letter-spacing: 0.3px;
  grid-column: 1 / -1;
}

/* ════════════════════════════════════════════════════════════════════
   RESPONSIVE
   ════════════════════════════════════════════════════════════════════ */
@media (max-width: 900px) {
  .wrap { padding: 20px 20px 48px; grid-template-columns: 1fr 1fr; gap: 12px; }
  #hero-card, #headlines-card, #markets-card, #companies-card,
  #portfolio-strip, #wc-fixtures-card, #fixtures-card,
  #spotify-card, #calendar-card, #wc-fantasy-card,
  #golf-card { grid-column: 1 / -1; }
  .hero-h1 { font-size: clamp(28px, 6vw, 48px); }
  .markets-grid { grid-template-columns: repeat(3, 1fr); }
}
@media (max-width: 640px) {
  .wrap { grid-template-columns: 1fr; padding: 14px 14px 40px; gap: 10px; }
  .wrap > .card { grid-column: 1 / -1 !important; }
  .hero-inner { flex-direction: column; }
  .hero-weather-panel { text-align: left; min-width: 0; border-left: none; border-top: 1px solid var(--line); width: 100%; align-items: flex-start; padding: 16px 28px; }
  .markets-grid { grid-template-columns: 1fr 1fr; }
  .fixtures-grid { grid-template-columns: 1fr; }
  .fpl-pitch { padding: 16px 8px 14px; overflow-x: auto; }
  .pitch-relative { min-width: 320px; }
}

@media (max-width: 480px) {
  /* Hero */
  .hero-temp { font-size: 52px; letter-spacing: -2px; }
  .hero-h1   { font-size: 26px; letter-spacing: -1px; }
  /* Companies carousel */
  .co-featured-name { font-size: 30px; letter-spacing: -1px; }
  .co-featured-pct  { font-size: 26px; letter-spacing: -0.5px; }
  .co-featured-desc { font-size: 15px; }
  /* FPL header */
  .fpl-team-name     { font-size: 24px; }
  .fpl-stat-value    { font-size: 22px; }
  .fpl-stat-value.sm { font-size: 18px; }
  /* FPL pitch — shrink chips so 5 defenders fit ~375px */
  .player-chip        { width: 52px; }
  .player-chip.bench  { width: 44px; }
  .player-kit         { width: 34px !important; height: 34px !important; }
  .player-kit-initial { font-size: 12px; }
  .player-name        { font-size: 10px; max-width: 52px; }
  .player-pts         { font-size: 9px; padding: 1px 4px; }
  /* Portfolio detail — just show name + value */
  .port-detail-row   { grid-template-columns: 1fr auto; }
  .port-detail-units,
  .port-detail-price { display: none; }
  /* Headlines */
  #hl-carousel { min-height: 200px; }
  .hl-item-title { font-size: 15px; }
  .hl-item.featured .hl-item-title { font-size: 16px; }
  /* Markets */
  .market-value { font-size: 18px; }
}

@media (prefers-reduced-motion: reduce) {
  .cup-reveal, .cup-reveal.is-in, .headlines-tab-content {
    animation: none !important;
    opacity: 1 !important;
    transform: none !important;
  }
  .cup-press:active { transform: none; }
  .cup-row:hover { transform: none; }
  .card.hover-lift:hover { transform: none; }
}
</style>
</head>

// ════════════════════════════════════════════════════════════════════
// CONFIG
// ════════════════════════════════════════════════════════════════════
const PORTFOLIO   = { 'AIAG': 'AIAG.L', 'All World': 'VWRP.L', 'US 500': 'VUSA.L' };
const PORT_UNITS  = { 'AIAG': 74, 'All World': 45, 'US 500': 35.99 };
const INDEX_NAMES = ['FTSE 100', 'S&P 500', 'NASDAQ', 'Nikkei', 'Gold', 'Bitcoin'];

// Placeholder index values for skeletons — will be overwritten with real data
const INDEX_PLACEHOLDERS = {
  'FTSE 100': { value: 8600,    decimals: 0 },
  'S&P 500':  { value: 5500,    decimals: 2 },
  'NASDAQ':   { value: 19500,   decimals: 2 },
  'Nikkei':   { value: 38000,   decimals: 0 },
  'Gold':     { value: 3350,    decimals: 2 },
  'Bitcoin':  { value: 57000,   decimals: 0 },
};

const CLUB_COLOR = {};

let GBPUSD = 1.27;

// ════════════════════════════════════════════════════════════════════
// HELPERS
// ════════════════════════════════════════════════════════════════════
function toGBP(price, currency) {
  if (price == null) return null;
  if (currency === 'GBp') return price / 100;
  if (currency === 'USD') return price / GBPUSD;
  return price;
}

function fmtGBP(val, d = 2) {
  if (val == null) return '—';
  return '£' + val.toLocaleString('en-GB', { minimumFractionDigits: d, maximumFractionDigits: d });
}

function fmtNum(n, d = 0) {
  if (n == null || isNaN(n)) return '—';
  return n.toLocaleString('en-GB', { minimumFractionDigits: d, maximumFractionDigits: d });
}

function sign(n) { return n >= 0 ? '+' : ''; }

// ════════════════════════════════════════════════════════════════════
// COUNT-UP (vanilla rAF tween)
// ════════════════════════════════════════════════════════════════════
const __PRM = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function countUp(el, target, { prefix = '', suffix = '', decimals = 0, dur = 1200, format } = {}) {
  if (target == null || isNaN(target)) { el.textContent = prefix + '—' + suffix; return; }
  if (__PRM) {
    const txt = format ? format(target) : fmtNum(target, decimals);
    el.textContent = prefix + txt + suffix;
    return;
  }
  const t0 = performance.now();
  const from = 0, to = target;
  function tick(t) {
    const p = Math.min(1, (t - t0) / dur);
    const e = 1 - Math.pow(1 - p, 3); // ease-out cubic
    const v = from + (to - from) * e;
    const txt = format ? format(v) : fmtNum(v, decimals);
    el.textContent = prefix + txt + suffix;
    if (p < 1) requestAnimationFrame(tick);
    else el.textContent = prefix + (format ? format(to) : fmtNum(to, decimals)) + suffix;
  }
  requestAnimationFrame(tick);
}

// ════════════════════════════════════════════════════════════════════
// INTERSECTION OBSERVER REVEAL
// ════════════════════════════════════════════════════════════════════
const revealObserver = new IntersectionObserver(entries => {
  entries.forEach(e => {
    if (e.isIntersecting) {
      e.target.classList.add('is-in');
      revealObserver.unobserve(e.target);
    }
  });
}, { threshold: 0.08, rootMargin: '0px 0px -40px 0px' });

document.querySelectorAll('.cup-reveal').forEach((el, i) => {
  el.style.setProperty('--cup-delay', (i * 60) + 'ms');
  revealObserver.observe(el);
});

// ════════════════════════════════════════════════════════════════════
// HERO PARALLAX
// ════════════════════════════════════════════════════════════════════
(function initParallax() {
  if (__PRM) return;
  const card  = document.getElementById('hero-card');
  const blob1 = document.getElementById('hero-blob1');
  const blob2 = document.getElementById('hero-blob2');
  let mouse   = { x: 0, y: 0 };
  let target  = { x: 0, y: 0 };
  let rafId   = null;

  card.addEventListener('mousemove', e => {
    const r = card.getBoundingClientRect();
    target.x = (e.clientX - r.left) / r.width - 0.5;
    target.y = (e.clientY - r.top) / r.height - 0.5;
  });
  card.addEventListener('mouseleave', () => { target.x = 0; target.y = 0; });

  function loop() {
    mouse.x += (target.x - mouse.x) * 0.08;
    mouse.y += (target.y - mouse.y) * 0.08;
    if (blob1) blob1.style.transform = `translate3d(${(mouse.x * 28).toFixed(2)}px, ${(mouse.y * 28).toFixed(2)}px, 0)`;
    if (blob2) blob2.style.transform = `translate3d(${(mouse.x * 14).toFixed(2)}px, ${(mouse.y * 14).toFixed(2)}px, 0)`;
    rafId = requestAnimationFrame(loop);
  }
  rafId = requestAnimationFrame(loop);
})();


// ════════════════════════════════════════════════════════════════════
// WEATHER
// ════════════════════════════════════════════════════════════════════
const WMO_DESC = {
  0:'Clear sky',1:'Clear sky',2:'Partly cloudy',3:'Overcast',
  45:'Fog',48:'Freezing fog',
  51:'Light drizzle',53:'Drizzle',55:'Heavy drizzle',
  61:'Light rain',63:'Rain',65:'Heavy rain',
  71:'Light snow',73:'Snow',75:'Heavy snow',
  80:'Showers',81:'Heavy showers',82:'Showers',
  95:'Thunderstorm',96:'Thunderstorm',99:'Thunderstorm',
};
const UV_LABEL = uv => uv <= 2 ? 'Low' : uv <= 5 ? 'Moderate' : uv <= 7 ? 'High' : uv <= 10 ? 'Very high' : 'Extreme';

// SVG weather icons keyed by condition category
function _weatherIcon(code) {
  const sun = `<circle cx="32" cy="32" r="11" fill="#e89a2f"/>
    <g stroke="#e89a2f" stroke-width="2.5" stroke-linecap="round" opacity="0.7">
      <line x1="32" y1="8" x2="32" y2="14"/><line x1="32" y1="50" x2="32" y2="56"/>
      <line x1="8" y1="32" x2="14" y2="32"/><line x1="50" y1="32" x2="56" y2="32"/>
      <line x1="15.5" y1="15.5" x2="19.7" y2="19.7"/><line x1="44.3" y1="44.3" x2="48.5" y2="48.5"/>
      <line x1="48.5" y1="15.5" x2="44.3" y2="19.7"/><line x1="19.7" y1="44.3" x2="15.5" y2="48.5"/>
    </g>`;
  const cloud = `<path d="M44 38H20a10 10 0 010-20 10 10 0 0119.3-3A9 9 0 1144 38z" fill="#94a3b8" opacity="0.85"/>`;
  const partCloud = sun + `<path d="M46 44H26a8 8 0 010-16 8 8 0 0115.5-2A7 7 0 1146 44z" fill="#cbd5e1" opacity="0.9"/>`;
  const rain = cloud + `<g stroke="#60a5fa" stroke-width="2.2" stroke-linecap="round" opacity="0.85">
    <line x1="24" y1="44" x2="22" y2="52"/><line x1="32" y1="44" x2="30" y2="52"/>
    <line x1="40" y1="44" x2="38" y2="52"/>
  </g>`;
  const snow = cloud + `<g fill="#bfdbfe" opacity="0.9">
    <circle cx="24" cy="49" r="2.5"/><circle cx="32" cy="52" r="2.5"/><circle cx="40" cy="49" r="2.5"/>
  </g>`;
  const fog = `<g stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" opacity="0.7">
    <line x1="14" y1="26" x2="50" y2="26"/><line x1="18" y1="33" x2="46" y2="33"/>
    <line x1="14" y1="40" x2="50" y2="40"/>
  </g>`;
  const storm = rain + `<path d="M35 26l-5 10h4l-4 10" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>`;

  const c = code;
  if (c <= 1)                       return { svg: sun, anim: 'weather-spin' };
  if (c === 2)                      return { svg: partCloud, anim: '' };
  if (c === 3)                      return { svg: cloud, anim: '' };
  if (c >= 45 && c <= 48)           return { svg: fog, anim: '' };
  if (c >= 51 && c <= 67)           return { svg: rain, anim: 'weather-drip' };
  if (c >= 71 && c <= 77)           return { svg: snow, anim: '' };
  if (c >= 80 && c <= 82)           return { svg: rain, anim: 'weather-drip' };
  if (c >= 95)                      return { svg: storm, anim: '' };
  return { svg: sun, anim: '' };
}

async function fetchWeather() {
  try {
    const r = await fetch(
      'https://api.open-meteo.com/v1/forecast?latitude=51.4214&longitude=-0.2062' +
      '&current=temperature_2m,weather_code' +
      '&daily=temperature_2m_max,temperature_2m_min,uv_index_max,precipitation_sum' +
      '&timezone=Europe%2FLondon'
    );
    const d    = await r.json();
    const temp = Math.round(d.current.temperature_2m);
    const high = Math.round(d.daily.temperature_2m_max[0]);
    const low  = Math.round(d.daily.temperature_2m_min[0]);
    const uv   = Math.round(d.daily.uv_index_max[0]);
    const rain = d.daily.precipitation_sum?.[0] ?? 0;
    const code = d.current.weather_code;
    const desc = WMO_DESC[code] || 'Clear';

    const tempEl    = document.getElementById('hero-temp');
    const condEl    = document.getElementById('hero-condition');
    const hlEl      = document.getElementById('hero-hl');
    const sumEl     = document.getElementById('hero-summary');
    const iconEl    = document.getElementById('hero-weather-icon');
    const pillsEl   = document.getElementById('hero-weather-pills');
    const blob1     = document.getElementById('hero-blob1');
    const blob2     = document.getElementById('hero-blob2');

    // Update icon
    if (iconEl) {
      const { svg, anim } = _weatherIcon(code);
      const animStyle = anim === 'weather-spin'
        ? 'style="transform-origin:50% 50%; animation: cup-spin 60s linear infinite"'
        : '';
      iconEl.innerHTML = `<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <g ${animStyle}>${svg}</g></svg>`;
    }

    // Adapt blob colours to weather condition
    if (blob1 && blob2) {
      if (code <= 1) { // sunny
        blob1.style.background = 'radial-gradient(circle, rgba(232,154,47,0.52), transparent 65%)';
        blob2.style.background = 'radial-gradient(circle, rgba(251,191,36,0.22), transparent 65%)';
      } else if (code <= 3) { // cloudy
        blob1.style.background = 'radial-gradient(circle, rgba(148,163,184,0.40), transparent 65%)';
        blob2.style.background = 'radial-gradient(circle, rgba(100,116,139,0.20), transparent 65%)';
      } else if (code >= 51 && code <= 82) { // rain
        blob1.style.background = 'radial-gradient(circle, rgba(96,165,250,0.38), transparent 65%)';
        blob2.style.background = 'radial-gradient(circle, rgba(59,130,246,0.22), transparent 65%)';
      } else if (code >= 71 && code <= 77) { // snow
        blob1.style.background = 'radial-gradient(circle, rgba(186,230,253,0.50), transparent 65%)';
        blob2.style.background = 'radial-gradient(circle, rgba(147,197,253,0.28), transparent 65%)';
      }
    }

    if (tempEl) countUp(tempEl, temp, { decimals: 0, dur: 1200 });
    if (condEl) condEl.textContent = desc;
    if (hlEl)   hlEl.textContent = `${high}° high · ${low}° low`;
    if (pillsEl) {
      pillsEl.innerHTML = [
        `<span class="hero-wpill">UV ${uv} — ${UV_LABEL(uv)}</span>`,
        rain > 0 ? `<span class="hero-wpill">${rain.toFixed(1)}mm rain</span>` : '',
      ].join('');
    }
    if (sumEl) {
      sumEl.innerHTML = `A <strong style="color:var(--ink);font-weight:600">${desc.toLowerCase()}</strong> day in <strong style="color:var(--ink);font-weight:600">SW19</strong>. ${temp}°C now, peaking at ${high}°C.`;
    }
  } catch (_) {
    const sumEl = document.getElementById('hero-summary');
    if (sumEl) sumEl.textContent = 'Weather unavailable.';
  }
}

// PORTFOLIO STRIP
// ════════════════════════════════════════════════════════════════════
function renderPortfolioStrip(prices) {
  let total = 0;
  const holdingData = [];

  for (const [name] of Object.entries(PORTFOLIO)) {
    const raw  = prices[name] || {};
    // Log raw data so price issues can be debugged in browser console
    console.log(`[Portfolio] ${name}: price=${raw.price}, currency=${raw.currency}, change=${raw.change?.toFixed(2)}%`);
    const gbp  = toGBP(raw.price, raw.currency);
    const u    = PORT_UNITS[name] || 0;
    if (gbp && u) {
      const val = gbp * u;
      total += val;
      holdingData.push({ name, pct: raw.change || 0, price: gbp, units: u, val });
    } else {
      holdingData.push({ name, pct: raw.change || null, price: gbp, units: u, val: 0 });
    }
  }

  const chipsEl  = document.getElementById('port-fund-chips');
  const detailEl = document.getElementById('port-detail-inner');

  if (chipsEl) {
    chipsEl.innerHTML = holdingData.map(h => {
      const pctStr = h.pct != null
        ? (h.pct >= 0 ? '+' : '') + h.pct.toFixed(2) + '%'
        : '—';
      const cls  = h.pct != null ? (h.pct >= 0 ? 'up' : 'down') : '';
      const bg   = h.pct == null ? '' : h.pct >= 0
        ? 'background:rgba(31,138,91,0.08)'
        : 'background:rgba(192,57,43,0.07)';
      return `<div class="port-fund-chip" style="${bg}">
        <div class="port-fund-name">${h.name}</div>
        <div class="port-fund-pct ${cls}">${pctStr}</div>
      </div>`;
    }).join('');
  }

  if (detailEl) {
    const rows = holdingData.map(h => `
      <div class="port-detail-row">
        <div class="port-detail-fund">${h.name}</div>
        <div class="port-detail-units">${h.units} units</div>
        <div class="port-detail-price">${h.price != null ? '£' + h.price.toFixed(2) : '—'}</div>
        <div class="port-detail-val">${h.val ? '£' + h.val.toFixed(2) : '—'}</div>
      </div>`).join('');
    detailEl.innerHTML = rows + `<div class="port-total-row">
      <span class="port-total-label">Total</span>
      <span class="port-total-value">${total ? '£' + total.toLocaleString('en-GB', {minimumFractionDigits:2,maximumFractionDigits:2}) : '—'}</span>
    </div>`;
  }
}

// ════════════════════════════════════════════════════════════════════
// MARKETS
// ════════════════════════════════════════════════════════════════════
function renderMarkets(prices) {
  const el = document.getElementById('markets-grid');
  if (!el) return;
  el.innerHTML = INDEX_NAMES.map(name => {
    const d   = prices[name] || {};
    const raw = d.price;
    const chg = d.change;
    const placeholder = INDEX_PLACEHOLDERS[name] || {};
    const displayVal  = raw || placeholder.value;
    const dec = name === 'FTSE 100' || name === 'Nikkei' || name === 'Bitcoin' ? 0 : 2;
    const cls = (chg || 0) >= 0 ? 'up' : 'down';
    const chgStr = chg != null ? (chg >= 0 ? '+' : '') + chg.toFixed(2) + '%' : '';
    return `<div class="market-cell cup-reveal">
      <div class="market-name">${name}</div>
      <div class="market-value-row">
        <span class="market-value" data-target="${displayVal}" data-dec="${dec}">—</span>
        ${chgStr ? `<span class="pct-chip ${cls}">${chgStr}</span>` : ''}
      </div>
    </div>`;
  }).join('');

  // Trigger count-up on market values
  el.querySelectorAll('.market-value[data-target]').forEach(el2 => {
    const target = parseFloat(el2.dataset.target);
    const dec    = parseInt(el2.dataset.dec, 10) || 0;
    // Use IntersectionObserver for delayed count-up
    const io = new IntersectionObserver(entries => {
      entries.forEach(e => {
        if (e.isIntersecting) {
          countUp(el2, target, { decimals: dec, dur: 1400 });
          io.unobserve(el2);
        }
      });
    }, { threshold: 0.1 });
    io.observe(el2);
    // Also observe for reveal
    revealObserver.observe(el2.closest('.market-cell'));
  });
}

let _openWcChip = null;
function toggleWcChip(id) {
  const chip = document.getElementById(id);
  const exp  = document.getElementById(id + '-exp');
  if (!chip || !exp) return;
  if (_openWcChip && _openWcChip !== id) {
    const p = document.getElementById(_openWcChip);
    const pe = document.getElementById(_openWcChip + '-exp');
    if (p) p.classList.remove('is-open');
    if (pe) pe.classList.remove('open');
  }
  const isOpen = exp.classList.contains('open');
  exp.classList.toggle('open', !isOpen);
  chip.classList.toggle('is-open', !isOpen);
  _openWcChip = isOpen ? null : id;
}

function renderWorldCup(wc) {

  const roundEl  = document.getElementById('wc-round-label');
  if (!heroEl || !scrollEl) return;

  const { matches = [], england, stageName = '' } = wc || {};

  if (stageEl) stageEl.textContent = stageName;
  if (roundEl) roundEl.textContent = matches.length ? `This round · ${stageName}` : '';

  // ── England hero ──────────────────────────────────────────────────
  if (!england) {
    heroEl.innerHTML = `<div class="wc-england-hero" style="text-align:center;color:var(--ink3);font-size:14px;padding:20px 0">No England fixture in this round</div>`;
  } else {
    const kickoff  = new Date(england.kickoff);
    const hoursAway = (kickoff - Date.now()) / 3_600_000;
    const hasScore  = england.homeScore !== null && england.awayScore !== null;

    let badgeClass, badgeText;
    if (england.live)           { badgeClass = 'live';     badgeText = `🔴 LIVE${england.matchTime ? ' · ' + england.matchTime + '\'' : ''}`; }
    else if (england.finished)  { badgeClass = 'ft';       badgeText = 'Full Time'; }
    else if (hoursAway < 6)     { badgeClass = 'today';    badgeText = 'Tonight'; }
    else if (hoursAway < 30)    { badgeClass = 'today';    badgeText = 'Tomorrow'; }
    else                        { badgeClass = 'upcoming'; badgeText = kickoff.toLocaleDateString('en-GB', { weekday:'short', day:'numeric', month:'short' }); }

    const scoreOrTime = hasScore
      ? `<div class="wc-hero-score">${england.homeScore}–${england.awayScore}${england.homePens !== null ? ` (${england.homePens}–${england.awayPens}p)` : ''}</div>`
      : `<div class="wc-hero-time">${kickoff.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})} · ${kickoff.toLocaleDateString('en-GB',{day:'numeric',month:'short'})}</div>`;

    let probHTML = '';
    if (!england.finished && england.odds?.h != null) {
      const pH = Math.round(100 / england.odds.h);
      const pD = england.odds.d ? Math.round(100 / england.odds.d) : 0;
      const pA = Math.round(100 / england.odds.a);
      const engIsHome = england.homeAbbr === 'ENG';
      const engP = engIsHome ? pH : pA;
      probHTML = `<div class="wc-hero-prob">Win probability: <span class="prob-hi">${engP}% England</span> · ${pD}% Draw · ${engIsHome ? pA : pH}% ${engIsHome ? england.away : england.home}</div>`;
    }

    const flagH = wcFlagHTML(england.homeFlag, england.homeAbbr, 32);
    const flagA = wcFlagHTML(england.awayFlag, england.awayAbbr, 32);

    heroEl.innerHTML = `<div class="wc-england-hero">
      <div class="wc-england-badge ${badgeClass}">${badgeText}</div>
      <div class="wc-hero-teams">
        ${flagH}
        <div><div class="wc-hero-team-name">${england.home}</div></div>
        <div class="wc-hero-vs">vs</div>
        ${flagA}
        <div><div class="wc-hero-team-name">${england.away}</div></div>
        ${scoreOrTime}
      </div>
      <div class="wc-hero-meta">${england.groupName}${england.stadium ? ' · ' + england.stadium : ''}${england.city ? ', ' + england.city : ''}</div>
      ${probHTML}
    </div>`;
  }

  // ── Round chips ───────────────────────────────────────────────────
  if (!matches.length) {
    scrollEl.innerHTML = '<p style="color:var(--ink3);font-size:14px">Fixtures unavailable.</p>';
    return;
  }

  scrollEl.innerHTML = matches.map((m, i) => {
    const cid     = `wc-c-${i}`;
    const kickoff = new Date(m.kickoff);
    const timeStr = kickoff.toLocaleString('en-GB', { weekday:'short', day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' });
    const hasScore = m.homeScore !== null && m.awayScore !== null;

    let bottomHTML;
    if (hasScore) {
      bottomHTML = `<div class="wc-chip-score">${m.homeScore}–${m.awayScore}${m.homePens !== null ? ` (${m.homePens}–${m.awayPens}p)` : ''}</div>`;
    } else if (m.odds?.h != null) {
      const favH = m.odds.h <= m.odds.a;
      bottomHTML = `<div class="wc-chip-odds">
        <span class="${favH ? 'fav-odd' : ''}">${m.odds.h.toFixed(2)}</span>
        <span>·</span><span>${m.odds.d?.toFixed(2) ?? '—'}</span>
        <span>·</span><span class="${!favH ? 'fav-odd' : ''}">${m.odds.a.toFixed(2)}</span>
      </div>`;
    } else {
      bottomHTML = `<div class="wc-chip-time">${kickoff.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}</div>`;
    }

    let expandBody = `<div class="wc-chip-expand-body"><div>${m.groupName}</div>`;
    if (m.stadium) expandBody += `<div>${m.stadium}${m.city ? ', ' + m.city : ''}</div>`;
    expandBody += `<div>${timeStr}</div>`;
    if (!hasScore && m.odds?.h != null) {
      const pH = Math.round(100 / m.odds.h);
      const pD = m.odds.d ? Math.round(100 / m.odds.d) : 0;
      const pA = Math.round(100 / m.odds.a);
      expandBody += `<div style="margin-top:4px">Win prob: ${pH}% · ${pD}% · ${pA}%</div>`;
    }
    expandBody += `</div>`;

    const fH = wcFlagHTML(m.homeFlag, m.homeAbbr, 22);
    const fA = wcFlagHTML(m.awayFlag, m.awayAbbr, 22);

    return `<div class="wc-chip cup-press" id="${cid}" onclick="toggleWcChip('${cid}')">
      <div class="wc-chip-flags">${fH}<span class="wc-chip-vs">vs</span>${fA}</div>
      <div class="wc-chip-teams">${m.home} – ${m.away}</div>
      ${bottomHTML}
      <div class="wc-chip-expand" id="${cid}-exp">
        <div class="wc-chip-expand-inner">${expandBody}</div>
      </div>
    </div>`;
  }).join('');
}

function renderWcFantasy(data) {
  const body    = document.getElementById('wc-fantasy-body');
  const roundEl = document.getElementById('wc-fantasy-round');
  if (!body) return;

  if (!data || data.error || (!data.topScorers?.length && !data.bestValue?.length)) {
    body.innerHTML = '<p style="color:var(--ink3);font-size:13px;padding:12px 0">Fantasy data unavailable.</p>';
    return;
  }

  if (roundEl) roundEl.textContent = data.roundName || '';

  const scorerLabel = data.preTournament ? 'Most Expensive' : 'Top Scorers';

  let html = `<div class="wc-fantasy-section-label">${scorerLabel}</div>`;
  html += (data.topScorers || []).map((p, i) => `
    <div class="wc-fantasy-row cup-row">
      <span class="wc-fantasy-rank">${i + 1}</span>
      <span class="wc-fantasy-name">${p.name}</span>
      <span class="wc-fantasy-squad">${p.squad}</span>
      <span class="wc-fantasy-val">${p.label}</span>
    </div>`).join('');

  if (!data.preTournament && data.bestValue?.length) {
    html += `<div class="wc-fantasy-section-label">Best Value · pts / $1m</div>`;
    html += data.bestValue.map((p, i) => `
      <div class="wc-fantasy-row cup-row">
        <span class="wc-fantasy-rank">${i + 1}</span>
        <span class="wc-fantasy-name">${p.name}</span>
        <span class="wc-fantasy-squad">${p.squad}</span>
        <span class="wc-fantasy-val green">${p.ratio}</span>
      </div>`).join('');
  }

  body.innerHTML = html;
}

function renderSpotify(data) {
  const el = document.getElementById('spotify-body');
  if (!el) return;

  if (!data || data.error) {
    el.innerHTML = '<p class="sp-unavailable">Spotify unavailable.</p>';
    return;
  }

  const { nowPlaying, recentTrack, topTrack, topArtist } = data;
  let html = '';

  const current = nowPlaying || recentTrack;
  if (current) {
    const isLive = !!nowPlaying?.isPlaying;
    const labelHTML = isLive
      ? `<div class="sp-section-label"><span class="sp-live-dot"></span>Now Playing</div>`
      : `<div class="sp-section-label">Recently Played${recentTrack?.minsAgo != null ? ' · ' + recentTrack.minsAgo + 'm ago' : ''}</div>`;
    html += labelHTML;
    html += `<a class="sp-row" href="${current.url || '#'}" target="_blank" rel="noopener">
      <img class="sp-art" src="${current.art}" alt="" onerror="this.style.opacity=0">
      <div class="sp-info">
        <div class="sp-title">${current.name}</div>
        <div class="sp-sub">${current.artist}${current.album ? ' · ' + current.album : ''}</div>
      </div>
    </a>`;
  }

  if (topTrack) {
    html += `<hr class="sp-divider">
    <div class="sp-section-label">Top Track · 4 Weeks</div>
    <a class="sp-row" href="${topTrack.url || '#'}" target="_blank" rel="noopener">
      <img class="sp-art-sm" src="${topTrack.art}" alt="" onerror="this.style.opacity=0">
      <div class="sp-info">
        <div class="sp-title sm">${topTrack.name}</div>
        <div class="sp-sub">${topTrack.artist}</div>
      </div>
    </a>`;
  }

  if (topArtist) {
    html += `<hr class="sp-divider">
    <div class="sp-section-label">Top Artist · 4 Weeks</div>
    <a class="sp-row" href="${topArtist.url || '#'}" target="_blank" rel="noopener">
      <img class="sp-art-sm" src="${topArtist.art}" alt="" onerror="this.style.opacity=0">
      <div class="sp-info">
        <div class="sp-title sm">${topArtist.name}</div>
        <div class="sp-sub">${topArtist.genre}</div>
      </div>
    </a>`;
  }

  el.innerHTML = html || '<p class="sp-unavailable">No Spotify data yet.</p>';
}

// ════════════════════════════════════════════════════════════════════
// GOLF
// ════════════════════════════════════════════════════════════════════
function renderGolf(golf) {
  const el = document.getElementById('golf-body');
  if (!el) return;

  // Trust the scraper's API-level time filter (timemin=11, timemax=17)
  // Frontend string comparison was incorrectly filtering valid tee times
  const allTees = golf.tee_times || [];

  if (!golf || !allTees.length) {
    const msg = golf?.error ? `Tee times temporarily unavailable.` : 'No tee times available.';
    el.innerHTML = `<div class="golf-empty">${msg}</div>`;
    if (golf?.scraped_at) {
      el.innerHTML += `<div class="golf-stale">Last scraped: ${new Date(golf.scraped_at).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' })} · refreshes Thu &amp; Sat mornings</div>`;
    }
    return;
  }

  const displayTees = allTees;

  // Sort by date + price
  const sorted = [...displayTees].sort((a, b) => {
    if (a.date !== b.date) return a.date.localeCompare(b.date);
    return (a.price_gbp || 0) - (b.price_gbp || 0);
  });

  const next     = sorted[0];
  const upcoming = sorted.slice(1, 8);

  const nextDt  = new Date(next.date + 'T12:00:00');
  const nextDay = nextDt.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' });

  // GolfNow courses-near-me returns the course's minimum time (often pre-dawn),
  // not a specific slot — show the window label instead
  function _timeLabel(t) {
    if (!t) return '11am–5pm';
    const h = parseInt((t || '0').split(':')[0], 10);
    if (h >= 11 && h < 17) return t;
    return '11am–5pm';
  }

  const hotBadge = next.is_hot_deal ? `<span class="golf-hot-badge">🔥 Hot Deal</span><br>` : '';

  const nextHTML = `
    <div class="golf-next-panel">
      <svg class="golf-pin-svg" viewBox="0 0 60 80">
        <path d="M30 8 L30 64" stroke="#1f8a5b" stroke-width="1.5"/>
        <path d="M30 8 L48 16 L30 24 Z" fill="#1f8a5b"/>
        <ellipse cx="30" cy="68" rx="14" ry="3" fill="#1f8a5b"/>
      </svg>
      ${hotBadge}
      <div class="golf-next-eyebrow">Next Tee</div>
      <div class="golf-course-name">${next.course_name}</div>
      <div class="golf-datetime-row">
        <span class="golf-date">${nextDay}</span>
        <span style="color:var(--ink3)">·</span>
        <span class="golf-time">${_timeLabel(next.tee_time)}</span>
        ${next.holes ? `<span class="golf-holes">${next.holes} holes</span>` : ''}
      </div>
      <a class="golf-book-btn" href="${next.booking_url}" target="_blank" rel="noopener">
        Book · £${parseFloat(next.price_gbp).toFixed(0)}
      </a>
    </div>`;

  const upcomingHTML = upcoming.length ? `
    <div>
      <div class="golf-upcoming-eyebrow">Upcoming</div>
      ${upcoming.map((t, i) => {
        const dt  = new Date(t.date + 'T12:00:00');
        const day = dt.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
        const hot = t.is_hot_deal ? ' 🔥' : '';
        return `<a class="golf-upcoming-row cup-row" href="${t.booking_url}" target="_blank" rel="noopener"
          style="border-bottom:${i < upcoming.length - 1 ? '1px solid var(--line)' : 'none'}">
          <div>
            <div class="golf-upcoming-course">${t.course_name}${hot}</div>
            <div class="golf-upcoming-meta">${day}${t.distance_miles ? ' · ' + t.distance_miles + ' mi' : ''}${t.holes ? ' · ' + t.holes + ' holes' : ''}</div>
          </div>
          <span class="golf-upcoming-price">£${parseFloat(t.price_gbp).toFixed(0)}</span>
        </a>`;
      }).join('')}
    </div>` : `<div><div class="golf-upcoming-eyebrow">Upcoming</div><div class="golf-empty" style="font-size:13px">No more slots.</div></div>`;

  el.innerHTML = `<div class="golf-two-col">${nextHTML}${upcomingHTML}</div>`;

  if (golf.scraped_at) {
    el.innerHTML += `<div class="golf-stale">Updated ${new Date(golf.scraped_at).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' })} · refreshes Thu &amp; Sat mornings</div>`;
  }
}

// HEADLINES EDITORIAL
// ════════════════════════════════════════════════════════════════════
const CAT_SOURCES = { 'AI': 'TechCrunch · The Verge', 'Tech': 'Ars Technica', 'World': 'BBC News', 'Football': 'BBC Sport · FIFA' };
const CAT_COLORS  = { 'AI': '#d97757', 'Tech': '#5e8a64', 'World': '#2a6fdb', 'Football': '#1f8a5b' };
let _hlSlides = [], _hlIdx = 0, _hlTimer = null;

function formatPubDate(str) {
  if (!str) return '';
  try {
    const d = new Date(str);
    if (isNaN(d)) return '';
    const diff = (Date.now() - d) / 60000;
    if (diff < 60)      return Math.round(diff) + 'm ago';
    if (diff < 1440)    return Math.round(diff / 60) + 'h ago';
    return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
  } catch (_) { return ''; }
}

function toggleHlMore(btn) {
  const wrap = btn.previousElementSibling;
  if (!wrap) return;
  const open = wrap.classList.toggle('open');
  btn.textContent = open ? '← Show less' : `View more →`;
}

function renderNews(news) {
  const carousel = document.getElementById('hl-carousel');
  const tabsEl   = document.getElementById('hl-tabs');
  if (!carousel) return;

  const cats = ['AI', 'Tech', 'World', 'Football'];
  _hlSlides = cats.map(cat => ({ cat, items: (news[cat] || []).slice(0, 6) }))
    .filter(s => s.items.length > 0);

  if (!_hlSlides.length) {
    carousel.innerHTML = '<p style="color:var(--ink3);font-size:14px;padding:16px 0">Headlines loading…</p>';
    return;
  }

  if (tabsEl) {
    tabsEl.innerHTML = _hlSlides.map((s, i) =>
      `<button class="hl-tab${i === 0 ? ' active' : ''}" onclick="goHlSlide(${i})">${s.cat}</button>`
    ).join('');
  }

  const itemHTML = (h, featured, col, source) => {
    const time = formatPubDate(h.pubDate);
    const meta = [source, time].filter(Boolean).join(' · ');
    const showDesc = h.description && h.description.length > 30 && h.description !== h.title;
    const titleStyle = featured ? `style="color:${col}"` : '';
    return `<a class="hl-item${featured ? ' featured' : ''}" href="${h.link || '#'}" target="_blank" rel="noopener">
      <div class="hl-item-meta" style="color:${col}">${meta}</div>
      <div class="hl-item-title" ${titleStyle}>${h.title}</div>
      ${showDesc ? `<div class="hl-item-desc">${h.description}</div>` : ''}
    </a>`;
  };

  carousel.innerHTML = _hlSlides.map((s, i) => {
    const source  = CAT_SOURCES[s.cat] || s.cat;
    const col     = CAT_COLORS[s.cat] || 'var(--cup-accent)';
    const first3  = s.items.slice(0, 3);
    const rest    = s.items.slice(3);
    return `<div class="hl-slide${i === 0 ? ' active' : ''}" data-idx="${i}">
      <div class="hl-items">
        ${first3.map((h, j) => itemHTML(h, j === 0, col, source)).join('')}
        ${rest.length ? `
          <div class="hl-more-wrap">
            ${rest.map(h => itemHTML(h, false, col, source)).join('')}
          </div>
          <button class="hl-view-more" onclick="toggleHlMore(this)">View more →</button>` : ''}
      </div>
    </div>`;
  }).join('');

  _hlIdx = 0;
  startHlCycle();
}

function goHlSlide(idx) {
  clearTimeout(_hlTimer);
  _hlIdx = idx;
  document.querySelectorAll('.hl-slide').forEach((el, i) => el.classList.toggle('active', i === idx));
  document.querySelectorAll('.hl-tab').forEach((el, i) => el.classList.toggle('active', i === idx));
  startHlCycle();
}

function startHlCycle() {
  clearTimeout(_hlTimer);
  if (_hlSlides.length < 2) return;
  _hlTimer = setTimeout(() => goHlSlide((_hlIdx + 1) % _hlSlides.length), 6000);
}

let _coCards = [], _coIdx = 0, _coTimer = null;

function renderCompanies(prices) {
  _coCards = CO_NAMES
    .map(name => ({ name, info: CO_INFO[name] || {}, ...(prices[name] || {}) }))
    .sort((a, b) => {
      const aHasPrice = a.change != null;
      const bHasPrice = b.change != null;
      if (aHasPrice && !bHasPrice) return -1;
      if (!aHasPrice && bHasPrice) return 1;
      if (aHasPrice && bHasPrice) return Math.abs(b.change) - Math.abs(a.change);
      return 0;
    });

  if (!_coCards.length) return;

  const navEl = document.getElementById('co-nav');
  if (navEl) {
    navEl.innerHTML = _coCards.map((_, i) =>
      `<button class="co-dot${i === 0 ? ' active' : ''}" onclick="goCoSlide(${i})"></button>`
    ).join('');
  }

  _coIdx = 0;
  _drawCoCard(_coIdx);
  _startCoCycle();
}

function _drawCoCard(idx) {
  const stage     = document.getElementById('co-stage');
  const counterEl = document.getElementById('co-counter');
  if (!stage || !_coCards.length) return;

  const c = _coCards[idx];
  const hasPrice = c.change != null;
  const cls      = (c.change || 0) >= 0 ? 'up' : 'down';
  const signChar = (c.change || 0) >= 0 ? '+' : '';
  const priceStr = c.price != null ? '$' + c.price.toFixed(2) : '';

  if (counterEl) counterEl.textContent = `${idx + 1} / ${_coCards.length}`;

  const fb = c.info.initials || c.name[0];
  const logoBox = `<div class="co-logo-box">
    ${c.info.logo
      ? `<img src="${c.info.logo}" alt="${c.name}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">
         <span class="co-logo-fb" style="display:none">${fb}</span>`
      : `<span class="co-logo-fb">${fb}</span>`
    }
  </div>`;

  const visitLink = c.info.url ? `
    <a class="co-visit-link" href="${c.info.url}" target="_blank" rel="noopener noreferrer">
      Visit
      <svg width="10" height="10" viewBox="0 0 10 10" fill="none">
        <path d="M2 8L8 2M8 2H4M8 2V6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </a>` : '';

  stage.innerHTML = `<div class="co-featured">
    <div class="co-featured-top">
      <div class="co-featured-left">
        <div class="co-featured-name">${c.name}</div>
        <div class="co-featured-tag">${c.info.tag || ''}</div>
      </div>
      <div class="co-featured-right">
        ${logoBox}
        ${hasPrice ? `<div class="co-featured-pct ${cls}">${signChar}${(c.change || 0).toFixed(2)}%</div>` : ''}
        ${priceStr ? `<div class="co-featured-price">${priceStr}</div>` : ''}
        ${visitLink}
      </div>
    </div>
    <div class="co-featured-desc">${c.info.desc || ''}</div>
  </div>`;
}

function goCoSlide(idx) {
  clearTimeout(_coTimer);
  const stage = document.getElementById('co-stage');
  const feat  = stage?.querySelector('.co-featured');
  if (feat) {
    feat.classList.add('fading');
    setTimeout(() => {
      _coIdx = idx;
      document.querySelectorAll('.co-dot').forEach((el, i) => el.classList.toggle('active', i === idx));
      _drawCoCard(idx);
      _startCoCycle();
    }, 320);
  } else {
    _coIdx = idx;
    document.querySelectorAll('.co-dot').forEach((el, i) => el.classList.toggle('active', i === idx));
    _drawCoCard(idx);
    _startCoCycle();
  }
}

function _startCoCycle() {
  clearTimeout(_coTimer);
  if (_coCards.length < 2) return;
  _coTimer = setTimeout(() => goCoSlide((_coIdx + 1) % _coCards.length), 5000);
}

// ════════════════════════════════════════════════════════════════════
// INIT
// ════════════════════════════════════════════════════════════════════
async function init() {
  // Hero date + greeting
  const now   = new Date();
  const hour  = now.getHours();
  const greet = hour < 12 ? 'Good morning' : hour < 17 ? 'Good afternoon' : 'Good evening';
  const dateStr = now.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });

  const dateEl = document.getElementById('hero-date');
  if (dateEl) dateEl.textContent = dateStr;

  const h1El = document.getElementById('hero-h1');
  if (h1El) h1El.innerHTML = `${greet}, <em>Jonno</em>.`;

  // Start weather fetch (independent)
  fetchWeather();

  // Fetch main data and WC fantasy in parallel
  const [data, wcFantasyData] = await Promise.all([
    getServerData(),
    fetch('/api/wc-fantasy').then(r => r.json()).catch(() => null),
  ]);

  // FX rate
  if (data.prices?.['FX_GBPUSD']?.price) GBPUSD = data.prices['FX_GBPUSD'].price;

  // Render sections
  renderPortfolioStrip(data.prices || {});
  renderMarkets(data.prices || {});
  renderCompanies(data.prices || {});
  renderNews(data.news || {});
  renderGolf(data.golf || null);
  renderWorldCup(data.worldCup || {});
  renderWcFantasy(wcFantasyData);
  renderCalendar(data.calendar || []);

  // Spotify: initial fetch + poll every 30s for live now-playing
  async function fetchAndRenderSpotify() {
    try {
      const sp = await fetch('/api/spotify').then(r => r.json());
      renderSpotify(sp);
    } catch (_) { renderSpotify(null); }
  }
  fetchAndRenderSpotify();
  setInterval(fetchAndRenderSpotify, 30_000);

  // Weather shine — sweeps the whole page when hovering the temperature area
  (function initShine() {
    if (__PRM) return;
    const heroRight = document.querySelector('.hero-weather-panel');
    const overlay   = document.getElementById('page-shine');
    if (!heroRight || !overlay) return;
    let active = false;
    heroRight.addEventListener('mouseenter', () => {
      if (active) return;
      active = true;
      overlay.classList.remove('sweeping');
      requestAnimationFrame(() => requestAnimationFrame(() => {
        overlay.classList.add('sweeping');
        setTimeout(() => { overlay.classList.remove('sweeping'); active = false; }, 1500);
      }));
    });
  })();
}

init();

// Portfolio: tap to expand on touch devices
(function initPortfolioTap() {
  const strip = document.getElementById('portfolio-strip');
  const hint  = strip?.querySelector('.port-total-hint');
  if (!strip) return;
  // Detect touch
  const isTouch = window.matchMedia('(hover: none)').matches;
  if (hint) hint.textContent = isTouch ? 'tap to expand' : 'hover to expand';
  if (isTouch) {
    strip.style.cursor = 'pointer';
    strip.addEventListener('click', () => {
      const open = strip.classList.toggle('expanded');
      if (hint) hint.textContent = open ? 'tap to collapse' : 'tap to expand';
    });
  }
})();
</script>
