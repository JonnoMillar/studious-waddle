<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Briefing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@900&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:     #ffffff;
  --ink:    #0f0f0f;
  --ink-2:  #374151;
  --ink-3:  #6b7280;
  --ink-4:  #e5e7eb;
  --ink-5:  #f9fafb;
  --accent: #E8451A;
  --green:  #16a34a;
  --red:    #dc2626;
  --f-d:    'Playfair Display', Georgia, serif;
  --f-m:    'JetBrains Mono', 'Courier New', monospace;
  --f-b:    'Plus Jakarta Sans', -apple-system, sans-serif;
}

html { scroll-behavior: smooth; }
body {
  font-family: var(--f-b);
  background: var(--bg);
  color: var(--ink);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

/* ── Layout ──────────────────────────────────────────────────── */
.wrap {
  max-width: 1160px;
  margin: 0 auto;
  padding: 48px 40px 80px;
}

/* ── Header ──────────────────────────────────────────────────── */
.header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  padding-bottom: 32px;
  border-bottom: 1px solid var(--ink-4);
  margin-bottom: 0;
}
.greeting {
  font-family: var(--f-d);
  font-size: clamp(1.9rem, 4vw, 2.6rem);
  font-weight: 900;
  color: var(--ink);
  letter-spacing: -0.02em;
  line-height: 1.1;
}
.header-meta {
  display: flex;
  flex-direction: column;
  gap: 4px;
  margin-top: 7px;
}
.dateline, .weather-line {
  font-family: var(--f-m);
  font-size: 11px;
  color: var(--ink-3);
  letter-spacing: 0.02em;
}
.header-right {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 8px;
  flex-shrink: 0;
  margin-top: 4px;
}
.live-badge {
  display: flex;
  align-items: center;
  gap: 7px;
  font-family: var(--f-m);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-3);
}
.live-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--accent);
  animation: livePulse 2s ease-in-out infinite;
  flex-shrink: 0;
}
@keyframes livePulse { 0%,100% { opacity:1; } 50% { opacity:0.3; } }

/* ── Section labels ──────────────────────────────────────────── */
.section { margin-top: 44px; }
.lbl {
  font-family: var(--f-m);
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--ink-3);
  margin-bottom: 16px;
}

/* ── Ticker ──────────────────────────────────────────────────── */
.ticker-outer {
  background: var(--ink);
  margin: 32px -40px 0;
  padding: 11px 0;
  overflow: hidden;
  position: relative;
}
.ticker-outer::before,
.ticker-outer::after {
  content: '';
  position: absolute;
  top: 0; bottom: 0; width: 64px; z-index: 2; pointer-events: none;
}
.ticker-outer::before { left:  0; background: linear-gradient(to right, var(--ink), transparent); }
.ticker-outer::after  { right: 0; background: linear-gradient(to left,  var(--ink), transparent); }
.ticker-track {
  display: flex;
  white-space: nowrap;
  animation: tickerMove 45s linear infinite;
}
.ticker-track:hover { animation-play-state: paused; }
@keyframes tickerMove { from { transform:translateX(0); } to { transform:translateX(-50%); } }
.tick-item {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 0 24px;
  border-right: 1px solid rgba(255,255,255,0.07);
}
.t-name  { font-family: var(--f-m); font-size: 10px; color: rgba(255,255,255,0.32); letter-spacing: 0.1em; text-transform: uppercase; }
.t-price { font-family: var(--f-m); font-size: 13px; font-weight: 500; color: #fff; }
.t-chg   { font-family: var(--f-m); font-size: 11px; }
.t-chg.up   { color: #4ade80; }
.t-chg.down { color: #f87171; }

/* ── Markets ─────────────────────────────────────────────────── */
.indices-strip {
  display: flex;
  background: var(--ink-5);
  border: 1px solid var(--ink-4);
  border-radius: 8px;
  overflow: hidden;
  margin-bottom: 16px;
}
.idx-cell {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 18px;
  border-right: 1px solid var(--ink-4);
}
.idx-cell:last-child { border-right: none; }
.idx-name  { font-family: var(--f-m); font-size: 10px; color: var(--ink-3); letter-spacing: 0.08em; text-transform: uppercase; white-space: nowrap; }
.idx-price { font-family: var(--f-m); font-size: 14px; font-weight: 500; color: var(--ink); }
.idx-chg   { font-family: var(--f-m); font-size: 11px; margin-left: auto; white-space: nowrap; }
.idx-chg.up   { color: var(--green); }
.idx-chg.down { color: var(--red); }

.movers-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  border: 1px solid var(--ink-4);
  border-radius: 8px;
  overflow: hidden;
}
.movers-col { }
.movers-col:first-child { border-right: 1px solid var(--ink-4); }
.movers-head {
  font-family: var(--f-m);
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--ink-3);
  padding: 11px 18px;
  border-bottom: 1px solid var(--ink-4);
  background: var(--ink-5);
}
.mover-row {
  display: grid;
  grid-template-columns: 1fr auto auto;
  gap: 14px;
  align-items: center;
  padding: 11px 18px;
  border-bottom: 1px solid var(--ink-4);
}
.mover-row:last-child { border-bottom: none; }
.m-name  { font-family: var(--f-b); font-size: 13px; font-weight: 600; color: var(--ink); }
.m-price { font-family: var(--f-m); font-size: 12px; color: var(--ink-3); }
.m-chg   { font-family: var(--f-m); font-size: 13px; font-weight: 500; min-width: 58px; text-align: right; }
.m-chg.up   { color: var(--green); }
.m-chg.down { color: var(--red); }

/* ── Company Carousel ────────────────────────────────────────── */
.carousel {
  border: 1px solid var(--ink-4);
  border-left: 3px solid var(--accent);
  border-radius: 8px;
  overflow: hidden;
}
.carousel-tabs {
  display: flex;
  border-bottom: 1px solid var(--ink-4);
  overflow-x: auto;
  scrollbar-width: none;
}
.carousel-tabs::-webkit-scrollbar { display: none; }
.ctab {
  flex: 1; min-width: 0;
  padding: 11px 14px;
  background: var(--ink-5);
  border: none;
  border-right: 1px solid var(--ink-4);
  cursor: pointer;
  font-family: var(--f-m);
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.04em;
  color: var(--ink-3);
  text-align: left;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  transition: background 0.15s, color 0.15s;
}
.ctab:last-child { border-right: none; }
.ctab:hover  { background: var(--bg); color: var(--ink-2); }
.ctab.active { background: var(--bg); color: var(--ink); }
.carousel-body {
  display: grid;
  grid-template-columns: 1fr 148px;
  gap: 32px;
  padding: 26px 30px;
  min-height: 140px;
  align-items: start;
}
.c-tag {
  display: inline-block;
  font-family: var(--f-m);
  font-size: 9px; font-weight: 500;
  letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--accent);
  background: rgba(232,69,26,0.07);
  padding: 3px 10px; border-radius: 3px;
  margin-bottom: 10px;
}
.c-name {
  font-family: var(--f-d);
  font-size: 24px; font-weight: 900;
  color: var(--ink);
  line-height: 1.15; letter-spacing: -0.02em;
  margin-bottom: 9px;
}
.c-desc {
  font-family: var(--f-b);
  font-size: 14px; color: var(--ink-2); line-height: 1.6;
  margin-bottom: 14px;
}
.c-link {
  font-family: var(--f-m);
  font-size: 12px; color: var(--ink-3);
  text-decoration: none; transition: color 0.12s;
}
.c-link:hover { color: var(--ink); }
.c-spark-wrap {
  display: flex; flex-direction: column;
  align-items: flex-end; gap: 8px; padding-top: 4px;
}
.c-spark-lbl {
  font-family: var(--f-m);
  font-size: 10px; letter-spacing: 0.06em;
}
.carousel-progress { height: 3px; background: var(--ink-4); }
.carousel-bar      { height: 3px; width: 0; background: var(--accent); }

/* ── Fixtures ────────────────────────────────────────────────── */
.fixtures-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
  gap: 10px;
}
.fixture {
  border: 1px solid var(--ink-4);
  border-radius: 8px;
  padding: 14px 18px;
  transition: border-color 0.15s;
}
.fixture:hover { border-color: #9ca3af; }
.fixture.chelsea { border-left: 3px solid var(--accent); }
.fix-meta {
  display: flex; gap: 8px; align-items: center;
  margin-bottom: 10px;
}
.gw {
  font-family: var(--f-m); font-size: 9px; font-weight: 500;
  letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--ink-3); background: var(--ink-5);
  padding: 2px 7px; border-radius: 3px;
}
.fix-time { font-family: var(--f-m); font-size: 11px; color: var(--ink-3); }
.fix-matchup { display: flex; align-items: center; gap: 8px; }
.fix-team    { display: flex; align-items: center; gap: 7px; flex: 1; min-width: 0; }
.fix-team-r  { justify-content: flex-end; }
.fix-badge   { width: 22px; height: 22px; object-fit: contain; flex-shrink: 0; }
.fix-name    { font-family: var(--f-b); font-size: 13px; font-weight: 600; color: var(--ink); line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fix-vs      { font-family: var(--f-m); font-size: 10px; color: var(--ink-3); flex-shrink: 0; }

/* ── Portfolio (compact) ─────────────────────────────────────── */
.portfolio-compact {
  border: 1px solid var(--ink-4);
  border-radius: 8px;
  overflow: hidden;
}
.pc-total-row {
  display: grid;
  grid-template-columns: 1fr auto auto;
  gap: 20px;
  align-items: center;
  padding: 18px 22px;
  background: var(--ink-5);
  border-bottom: 1px solid var(--ink-4);
}
.pc-total-label {
  font-family: var(--f-m);
  font-size: 10px; font-weight: 500;
  letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--ink-3);
}
.pc-total-val {
  font-family: var(--f-d);
  font-size: 1.9rem; font-weight: 900;
  color: var(--ink); letter-spacing: -0.02em; line-height: 1;
}
.pc-total-chg { font-family: var(--f-m); font-size: 13px; font-weight: 500; }
.pc-total-chg.up   { color: var(--green); }
.pc-total-chg.down { color: var(--red); }
.pc-row {
  display: grid;
  grid-template-columns: 1fr auto auto;
  gap: 20px;
  align-items: center;
  padding: 14px 22px;
  border-bottom: 1px solid var(--ink-4);
}
.pc-row:last-child { border-bottom: none; }
.pc-name { font-family: var(--f-b); font-size: 14px; font-weight: 600; color: var(--ink); }
.pc-sub  { font-family: var(--f-m); font-size: 10px; color: var(--ink-3); margin-top: 3px; }
.pc-val  { font-family: var(--f-m); font-size: 14px; font-weight: 500; color: var(--ink); text-align: right; }
.pc-chg  { font-family: var(--f-m); font-size: 12px; min-width: 64px; text-align: right; }
.pc-chg.up   { color: var(--green); }
.pc-chg.down { color: var(--red); }

/* ── News ────────────────────────────────────────────────────── */
.news-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  background: var(--ink-4);
  border: 1px solid var(--ink-4);
  border-radius: 8px;
  overflow: hidden;
  gap: 1px;
}
.news-col {
  background: var(--bg);
  padding: 22px 24px;
}
.news-col-title {
  font-family: var(--f-m);
  font-size: 10px; font-weight: 500;
  letter-spacing: 0.16em; text-transform: uppercase;
  color: var(--ink-3);
  margin-bottom: 14px; padding-bottom: 12px;
  border-bottom: 1px solid var(--ink-4);
}
.story {
  display: grid;
  grid-template-columns: 18px 1fr;
  gap: 10px;
  padding: 10px 0;
  border-bottom: 1px solid var(--ink-4);
  text-decoration: none;
  color: var(--ink-2);
  transition: color 0.12s;
}
.story:last-child  { border-bottom: none; padding-bottom: 0; }
.story:first-child { padding-top: 0; }
.story:hover       { color: var(--ink); }
.s-n {
  font-family: var(--f-m);
  font-size: 10px; color: var(--ink-4);
  padding-top: 3px; font-weight: 500;
  transition: color 0.12s;
}
.story:hover .s-n { color: var(--ink-3); }
.s-t { font-family: var(--f-b); font-size: 13px; line-height: 1.5; }
.story.lead .s-t   { font-size: 14px; font-weight: 600; color: var(--ink); }
.story.lead .s-n   { color: var(--accent); }

/* ── Skeleton ────────────────────────────────────────────────── */
.skeleton { background: var(--ink-4); border-radius: 6px; animation: shimmer 1.6s ease-in-out infinite; }
@keyframes shimmer { 0%,100% { opacity:1; } 50% { opacity:0.45; } }

/* ── Footer ──────────────────────────────────────────────────── */
.footer {
  margin-top: 52px; padding-top: 18px;
  border-top: 1px solid var(--ink-4);
  font-family: var(--f-m);
  font-size: 10px; color: var(--ink-3); letter-spacing: 0.08em;
}

/* ── Responsive ──────────────────────────────────────────────── */
@media (max-width: 680px) {
  .wrap { padding: 28px 18px 60px; }
  .ticker-outer { margin: 28px -18px 0; }
  .greeting { font-size: 1.8rem; }
  .header { flex-direction: column; gap: 14px; }
  .header-right { flex-direction: row; align-items: center; }
  .indices-strip { flex-wrap: wrap; }
  .idx-cell { min-width: 50%; }
  .movers-grid { grid-template-columns: 1fr; }
  .movers-col:first-child { border-right: none; border-bottom: 1px solid var(--ink-4); }
  .carousel-body { grid-template-columns: 1fr; }
  .c-spark-wrap { display: none; }
  .pc-total-row { grid-template-columns: 1fr auto; }
  .pc-total-val { font-size: 1.5rem; }
}
</style>
</head>

<div class="wrap">

<!-- Header -->
<div class="header">
  <div>
    <div class="greeting" id="greeting">Good morning, Jonno.</div>
    <div class="header-meta">
      <div class="dateline" id="dateline"></div>
      <div class="weather-line" id="weather-line"></div>
    </div>
  </div>
  <div class="header-right">
    <div class="live-badge"><span class="live-dot"></span>Live</div>
  </div>
</div>

<!-- Ticker -->
<div class="ticker-outer">
  <div class="ticker-track" id="ticker-track">
    <span class="tick-item"><span class="t-name">Loading</span><span class="t-price">—</span></span>
  </div>
</div>

<!-- Markets -->
<div class="section">
  <div class="lbl">Markets</div>
  <div class="indices-strip" id="indices">
    <div class="idx-cell skeleton" style="height:44px;flex:1"></div>
    <div class="idx-cell skeleton" style="height:44px;flex:1"></div>
    <div class="idx-cell skeleton" style="height:44px;flex:1"></div>
    <div class="idx-cell skeleton" style="height:44px;flex:1"></div>
  </div>
  <div class="movers-grid">
    <div class="movers-col">
      <div class="movers-head">Biggest Gains</div>
      <div id="movers-up"></div>
    </div>
    <div class="movers-col">
      <div class="movers-head">Biggest Losses</div>
      <div id="movers-dn"></div>
    </div>
  </div>
</div>

<!-- Company carousel -->
<div class="section">
  <div class="lbl">Company to Watch</div>
  <div class="carousel">
    <div class="carousel-tabs" id="carousel-tabs"></div>
    <div class="carousel-body" id="carousel-body"></div>
    <div class="carousel-progress"><div class="carousel-bar" id="carousel-bar"></div></div>

</div>

<!-- Fixtures -->
<div class="section">
  <div class="lbl">Upcoming Fixtures</div>
  <div class="fixtures-grid" id="fixtures">
    <div class="skeleton" style="height:80px;border-radius:8px"></div>
    <div class="skeleton" style="height:80px;border-radius:8px"></div>
    <div class="skeleton" style="height:80px;border-radius:8px"></div>
  </div>
</div>

<!-- Portfolio -->
<div class="section">
  <div class="lbl">Your Portfolio</div>
  <div class="portfolio-compact">
    <div class="pc-total-row">
      <span class="pc-total-label">Total Value</span>
      <span class="pc-total-val" id="pc-total">—</span>
      <span class="pc-total-chg" id="pc-chg"></span>
    </div>
    <div id="pc-holdings">
      <div class="pc-row skeleton" style="height:58px;border-radius:0"></div>
      <div class="pc-row skeleton" style="height:58px;border-radius:0"></div>
      <div class="pc-row skeleton" style="height:58px;border-radius:0"></div>
    </div>
  </div>
</div>

<!-- News -->
<div class="section">
  <div class="lbl">Today's Briefing</div>
  <div class="news-grid" id="news"></div>
</div>

<div class="footer" id="footer"></div>
</div>

// ── Helpers ───────────────────────────────────────────────────────────────────
function toGBP(price, currency) {
  if (price == null) return null;
  return currency === "GBp" ? price / 100 : price;
}

function fmtPrice(price, currency) {
  if (price == null) return "—";
  const p   = toGBP(price, currency);
  const sym = (currency === "GBp" || currency === "GBP") ? "£" : "";
  if (p > 10000) return sym + p.toLocaleString("en-GB", { maximumFractionDigits: 0 });
  if (p > 10)    return sym + p.toLocaleString("en-GB", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  return sym + p.toFixed(4);
}

// ── Weather ───────────────────────────────────────────────────────────────────
const WMO = {
  0:'Clear sky', 1:'Clear sky', 2:'Partly cloudy', 3:'Overcast',
  45:'Fog', 48:'Fog',
  51:'Light drizzle', 53:'Drizzle', 55:'Heavy drizzle',
  61:'Light rain', 63:'Rain', 65:'Heavy rain',
  71:'Light snow', 73:'Snow', 75:'Heavy snow',
  80:'Showers', 81:'Heavy showers', 82:'Showers',
  95:'Thunderstorm', 96:'Thunderstorm', 99:'Thunderstorm',
};
async function fetchWeather() {
  try {
    const r = await fetch(
      'https://api.open-meteo.com/v1/forecast?latitude=51.4214&longitude=-0.2062&current=temperature_2m,weather_code&timezone=Europe%2FLondon'
    );
    const d    = await r.json();
    const temp = Math.round(d.current.temperature_2m);
    const desc = WMO[d.current.weather_code] || '';
    document.getElementById('weather-line').textContent =
      `Wimbledon · ${temp}°C · ${desc}`;
  } catch (_) {}
}

// ── Sparkline (seeded per company) ────────────────────────────────────────────
function makeSparkline(seed) {
  const W = 148, H = 56, N = 24;
  const pts = [];
  let val = 30 + (seed % 25), r = seed;
  for (let i = 0; i < N; i++) {
    r   = (r * 1664525 + 1013904223) & 0x7fffffff;
    val = Math.max(5, Math.min(95, val + (r / 0x7fffffff - 0.43) * 10));
    pts.push(val);
  }
  const minV = Math.min(...pts), maxV = Math.max(...pts), range = maxV - minV || 10;
  const coords = pts.map((v, i) => {
    const x = 2 + (i / (N - 1)) * (W - 4);
    const y = H - 2 - ((v - minV) / range) * (H - 6);
    return `${x.toFixed(1)} ${y.toFixed(1)}`;
  });
  return { d: "M " + coords.join(" L "), isUp: pts[N - 1] >= pts[0] };
}

// ── Portfolio ─────────────────────────────────────────────────────────────────
function renderPortfolio(portfolio) {
  let total = 0, daily = 0;
  const rows = [];
  for (const [name, data] of Object.entries(portfolio)) {
    const gbp = toGBP(data.price, data.currency);
    const u   = UNITS[name] || 0;
    let val = null, chg = null;
    if (gbp && u) {
      val    = gbp * u;
      chg    = data.change || 0;
      total += val;
      daily += val * chg / 100;
    }
    rows.push({ name, val, chg, price: gbp, units: u });
  }

  document.getElementById('pc-total').textContent = total
    ? "£" + total.toLocaleString("en-GB", { minimumFractionDigits: 2, maximumFractionDigits: 2 })
    : "—";

  if (total) {
    const sign = daily >= 0 ? "+" : "";
    const el   = document.getElementById('pc-chg');
    el.textContent = `${sign}£${Math.abs(daily).toLocaleString("en-GB", { minimumFractionDigits: 2, maximumFractionDigits: 2 })} today`;
    el.className   = "pc-total-chg " + (daily >= 0 ? "up" : "down");
  }

  document.getElementById('pc-holdings').innerHTML = rows.map(({ name, val, chg, price, units }) => {
    const valStr   = val   ? "£" + val.toLocaleString("en-GB", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : "—";
    const priceStr = price ? (price > 1 ? "£" + price.toFixed(2) : "£" + price.toFixed(4)) + " / unit" : "";
    const chgStr   = chg != null ? (chg >= 0 ? "+" : "") + chg.toFixed(2) + "%" : "";
    const cls      = chg != null ? (chg >= 0 ? "up" : "down") : "";
    return `<div class="pc-row">
  <div><div class="pc-name">${name}</div><div class="pc-sub">${units} units · ${priceStr}</div></div>
  <span class="pc-val">${valStr}</span>
  <span class="pc-chg ${cls}">${chgStr}</span>
</div>`;
  }).join("");
}

  <span class="idx-price">${ps}</span>
  <span class="idx-chg ${cls}">${chg}</span>
</div>`;
  }).join("");

// ── Movers ────────────────────────────────────────────────────────────────────
function renderMovers(prices) {
  const all = MOVER_NAMES
    .map(n => ({ name: n, ...(prices[n] || { price: null, change: null, currency: "" }) }))
    .filter(m => m.price != null && m.change != null)
    .sort((a, b) => b.change - a.change);

  const gainers = all.filter(m => m.change >= 0).slice(0, 5);
  const losers  = all.filter(m => m.change < 0).slice(-5).reverse();

  function row(m) {
    const p   = toGBP(m.price, m.currency);
    const sym = (m.currency === "GBp" || m.currency === "GBP") ? "£" : "";
    const ps  = sym + (p > 100
      ? p.toLocaleString("en-GB", { maximumFractionDigits: 0 })
      : p.toLocaleString("en-GB", { minimumFractionDigits: 2, maximumFractionDigits: 2 }));
    const cls = m.change >= 0 ? "up" : "down";
    const sign = m.change >= 0 ? "+" : "";
    return `<div class="mover-row">
  <span class="m-name">${m.name}</span>
  <span class="m-price">${ps}</span>
  <span class="m-chg ${cls}">${sign}${m.change.toFixed(2)}%</span>
</div>`;
  }

  const noData = `<div class="mover-row"><span class="m-name" style="color:var(--ink-3)">No data</span></div>`;
  document.getElementById('movers-up').innerHTML = gainers.length ? gainers.map(row).join("") : noData;
  document.getElementById('movers-dn').innerHTML = losers.length  ? losers.map(row).join("")  : noData;
}

// ── Ticker ────────────────────────────────────────────────────────────────────
function buildTicker(prices) {
  const all = [...INDEX_NAMES, ...MOVER_NAMES];
  const items = all.map(n => {
    const d = prices[n];
    if (!d || d.price == null) return null;
    const p   = toGBP(d.price, d.currency);
    const sym = (d.currency === "GBp" || d.currency === "GBP") ? "£" : "";
    const ps  = sym + (p > 1000
      ? p.toLocaleString("en-GB", { maximumFractionDigits: 0 })
      : p.toLocaleString("en-GB", { minimumFractionDigits: 2, maximumFractionDigits: 2 }));
    const cls  = (d.change || 0) >= 0 ? "up" : "down";
    const chg  = d.change != null ? (d.change >= 0 ? "+" : "") + d.change.toFixed(2) + "%" : "";
    return `<span class="tick-item"><span class="t-name">${n}</span><span class="t-price">${ps}</span><span class="t-chg ${cls}">${chg}</span></span>`;
  }).filter(Boolean);
  if (!items.length) return;
  const half = items.join("");
  document.getElementById('ticker-track').innerHTML = half + half;
}

// ── Carousel ──────────────────────────────────────────────────────────────────
const CAROUSEL_SIZE = 5;
const CAROUSEL_MS   = 12000;
let cIdx = 0, cRafId = null, cRafTs = null, cCos = [];

function initCarousel() {
  const start  = new Date(new Date().getFullYear(), 0, 0);
  const dayNum = Math.floor((Date.now() - start) / 86400000);
  cCos = Array.from({ length: CAROUSEL_SIZE }, (_, i) => COMPANIES[(dayNum + i) % COMPANIES.length]);
  renderCarouselTabs(0);
  showSlide(0);
  startCycle();
}

function renderCarouselTabs(active) {
  document.getElementById('carousel-tabs').innerHTML = cCos.map((c, i) =>
    `<button class="ctab${i === active ? " active" : ""}" onclick="jumpCarousel(${i})">${c.name}</button>`
  ).join("");
}

function showSlide(idx) {
  cIdx = idx;
  document.querySelectorAll('.ctab').forEach((b, i) => b.classList.toggle('active', i === idx));
  const c = cCos[idx];
  const { d, isUp } = makeSparkline(COMPANIES.indexOf(c));
  const col  = isUp ? "#16a34a" : "#dc2626";
  const lbl  = isUp ? "Momentum up" : "Volatile";
  document.getElementById('carousel-body').innerHTML = `<div>
  <div class="c-tag">${c.tag}</div>
  <div class="c-name">${c.name}</div>
  <div class="c-desc">${c.what}</div>
  <a class="c-link" href="https://${c.url}" target="_blank" rel="noopener">${c.url} →</a>
</div>
<div class="c-spark-wrap">
  <svg width="148" height="56" viewBox="0 0 148 56" fill="none">
    <path d="${d}" stroke="${col}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <span class="c-spark-lbl" style="color:${col}">${lbl}</span>
</div>`;
}

function startCycle() {
  cancelAnimationFrame(cRafId);
  cRafTs = null;
  const bar = document.getElementById('carousel-bar');
  if (bar) bar.style.width = "0%";
  function tick(ts) {
    if (!cRafTs) cRafTs = ts;
    const pct = Math.min((ts - cRafTs) / CAROUSEL_MS, 1);
    if (bar) bar.style.width = (pct * 100).toFixed(1) + "%";
    if (pct < 1) { cRafId = requestAnimationFrame(tick); }
    else { showSlide((cIdx + 1) % CAROUSEL_SIZE); startCycle(); }
  }
  cRafId = requestAnimationFrame(tick);
}

function jumpCarousel(idx) {
  cancelAnimationFrame(cRafId);
  showSlide(idx);
  startCycle();
}

    buildTicker(data.prices || {});
    renderNews(data.news || {});
    renderFixtures((data.fixtures || []).map(f => {
      const dt  = new Date(f.kickoff);
      const day = dt.toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" });
      const tm  = dt.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
      return { ...f, time: `${day} · ${tm}` };
    }));
  });
}

init();
</script>
</body>
</html>
