<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Briefing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:        #07090f;
  --card:      rgba(255,255,255,0.03);
  --border:    rgba(255,255,255,0.07);
  --border-h:  rgba(59,130,246,0.35);
  --blue:      #3b82f6;
  --blue-dim:  rgba(59,130,246,0.12);
  --green:     #4ade80;
  --red:       #f87171;
  --text:      #f1f5f9;
  --muted:     #475569;
  --dimmer:    #1e293b;
}

html { scroll-behavior: smooth; }

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}

/* ── Animated background ─────────────────────────────────────────────────── */
.bg {
  position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
}
.blob {
  position: absolute; border-radius: 50%; filter: blur(90px); opacity: 0.5;
}
.blob-1 {
  width: 700px; height: 700px;
  background: radial-gradient(circle, rgba(59,130,246,0.07) 0%, transparent 70%);
  top: -200px; left: -200px;
  animation: drift1 28s ease-in-out infinite;
}
.blob-2 {
  width: 600px; height: 600px;
  background: radial-gradient(circle, rgba(139,92,246,0.05) 0%, transparent 70%);
  bottom: -150px; right: -100px;
  animation: drift2 35s ease-in-out infinite;
}
.blob-3 {
  width: 400px; height: 400px;
  background: radial-gradient(circle, rgba(16,185,129,0.04) 0%, transparent 70%);
  top: 50%; left: 50%; transform: translate(-50%,-50%);
  animation: drift3 22s ease-in-out infinite;
}
@keyframes drift1 {
  0%,100% { transform: translate(0,0) scale(1); }
  33%      { transform: translate(60px,-40px) scale(1.05); }
  66%      { transform: translate(-30px,50px) scale(0.95); }
}
@keyframes drift2 {
  0%,100% { transform: translate(0,0) scale(1); }
  40%      { transform: translate(-50px,30px) scale(1.08); }
  70%      { transform: translate(40px,-60px) scale(0.94); }
}
@keyframes drift3 {
  0%,100% { transform: translate(-50%,-50%) scale(1); }
  50%      { transform: translate(-50%,-50%) scale(1.2); }
}

/* ── Layout ──────────────────────────────────────────────────────────────── */
.wrap {
  position: relative; z-index: 1;
  max-width: 1200px; margin: 0 auto;
  padding: 48px 32px 80px;
}

/* ── Header ──────────────────────────────────────────────────────────────── */
.header {
  display: flex; align-items: flex-start; justify-content: space-between;
  margin-bottom: 56px;
  opacity: 0; animation: fadeUp 0.7s ease 0.05s forwards;
}
.greeting {
  font-size: 36px; font-weight: 800; letter-spacing: -1px;
  background: linear-gradient(120deg, #f8fafc 30%, #94a3b8 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
}
.dateline { font-size: 13px; color: var(--muted); margin-top: 6px; letter-spacing: 0.01em; }

.live-badge {
  display: flex; align-items: center; gap: 7px;
  background: rgba(74,222,128,0.07); border: 1px solid rgba(74,222,128,0.2);
  border-radius: 20px; padding: 5px 12px; font-size: 11px;
  color: var(--green); font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase;
  flex-shrink: 0; margin-top: 6px;
}
.live-dot {
  width: 6px; height: 6px; border-radius: 50%; background: var(--green);
  animation: livePulse 2s ease-in-out infinite;
}
@keyframes livePulse {
  0%,100% { opacity: 1; box-shadow: 0 0 0 0 rgba(74,222,128,0.5); }
  50%      { opacity: 0.7; box-shadow: 0 0 0 5px rgba(74,222,128,0); }
}

/* ── Sections ────────────────────────────────────────────────────────────── */
.section { margin-top: 44px; opacity: 0; animation: fadeUp 0.7s ease forwards; }
.section:nth-child(2) { animation-delay: 0.1s; }
.section:nth-child(3) { animation-delay: 0.18s; }
.section:nth-child(4) { animation-delay: 0.26s; }
.section:nth-child(5) { animation-delay: 0.34s; }
.section:nth-child(6) { animation-delay: 0.42s; }

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(18px); }
  to   { opacity: 1; transform: translateY(0); }
}

.section-label {
  display: flex; align-items: center; gap: 10px;
  font-size: 10px; font-weight: 700; letter-spacing: 0.14em;
  text-transform: uppercase; color: var(--blue); margin-bottom: 16px;
}
.section-label::before {
  content: ''; display: block; width: 18px; height: 2px;
  background: var(--blue); border-radius: 1px; flex-shrink: 0;
}

/* ── Price cards ─────────────────────────────────────────────────────────── */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(155px, 1fr)); gap: 12px; }

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px; padding: 20px 22px;
  backdrop-filter: blur(12px);
  transition: border-color 0.2s, box-shadow 0.2s, transform 0.2s;
  cursor: default;
}
.card:hover {
  border-color: var(--border-h);
  box-shadow: 0 0 28px rgba(59,130,246,0.08), 0 4px 20px rgba(0,0,0,0.3);
  transform: translateY(-2px);
}
.label { font-size: 11px; color: var(--muted); font-weight: 500; margin-bottom: 10px; letter-spacing: 0.02em; }
.value { font-size: 24px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; line-height: 1; }
.holding { font-size: 12px; color: #334155; margin-top: 6px; font-variant-numeric: tabular-nums; }
.change { font-size: 12px; font-weight: 600; margin-top: 7px; }
.up { color: var(--green); } .down { color: var(--red); }

.total { font-size: 13px; color: var(--muted); margin-top: 16px; }
.total-val { color: var(--text); font-weight: 700; font-size: 20px; margin-left: 8px; }
.total-daily { font-size: 14px; font-weight: 600; margin-left: 10px; }

/* ── Fixtures ────────────────────────────────────────────────────────────── */
.fixtures-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(215px, 1fr)); gap: 10px; margin-top: 16px; }
.fixture {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 14px; padding: 16px 20px; backdrop-filter: blur(12px);
  transition: border-color 0.2s, transform 0.2s;
}
.fixture:hover { border-color: var(--border-h); transform: translateY(-1px); }
.fixture.chelsea {
  border-color: rgba(29,78,216,0.5);
  background: rgba(29,78,216,0.06);
  box-shadow: 0 0 20px rgba(29,78,216,0.08);
}
.fix-meta { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
.gw {
  font-size: 9px; font-weight: 700; color: var(--blue); letter-spacing: 0.08em;
  background: var(--blue-dim); padding: 2px 8px; border-radius: 20px; text-transform: uppercase;
}
.fix-time { font-size: 11px; color: var(--muted); }
.fix-teams { font-size: 13.5px; color: #cbd5e1; font-weight: 600; }
.fix-teams em { font-style: normal; color: var(--muted); margin: 0 6px; font-size: 11px; font-weight: 400; }

/* ── Company card ────────────────────────────────────────────────────────── */
.company-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-left: 3px solid var(--blue);
  border-radius: 16px; padding: 28px 32px;
  backdrop-filter: blur(12px);
  position: relative; overflow: hidden;
}
.company-card::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 1px;
  background: linear-gradient(90deg, var(--blue) 0%, transparent 60%);
  opacity: 0.6;
}
.company-tag {
  display: inline-block; font-size: 9px; font-weight: 700; letter-spacing: 0.12em;
  text-transform: uppercase; color: var(--blue); background: var(--blue-dim);
  padding: 4px 11px; border-radius: 20px; margin-bottom: 14px;
}
.company-name { font-size: 26px; font-weight: 800; color: #f8fafc; margin-bottom: 12px; letter-spacing: -0.5px; }
.company-what { font-size: 14px; color: #cbd5e1; line-height: 1.65; margin-bottom: 10px; }
.company-why { font-size: 13px; color: var(--muted); line-height: 1.65; margin-bottom: 20px; font-style: italic; border-left: 2px solid var(--dimmer); padding-left: 12px; }
.company-footer { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
.company-link { font-size: 13px; color: var(--blue); text-decoration: none; transition: color 0.15s; }
.company-link:hover { color: #93c5fd; }
.company-next {
  background: none; border: 1px solid var(--border); color: var(--muted);
  font-family: inherit; font-size: 11px; font-weight: 500;
  padding: 6px 14px; border-radius: 20px; cursor: pointer;
  transition: border-color 0.15s, color 0.15s;
}
.company-next:hover { border-color: var(--border-h); color: #94a3b8; }

/* ── News ────────────────────────────────────────────────────────────────── */
.news-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(245px, 1fr)); gap: 14px; margin-top: 16px; }
.news-col {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 16px; padding: 24px; backdrop-filter: blur(12px);
}
.col-title {
  font-size: 10px; font-weight: 700; letter-spacing: 0.12em;
  text-transform: uppercase; color: var(--blue); margin-bottom: 18px;
}
.story {
  display: block; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.04);
  text-decoration: none; color: #64748b; font-size: 13px;
  line-height: 1.5; transition: color 0.15s;
}
.story:last-child { border-bottom: none; padding-bottom: 0; }
.story:first-child { padding-top: 0; }
.story:hover { color: #cbd5e1; }
.empty { color: #1e293b; font-size: 13px; }

/* ── Skeleton ────────────────────────────────────────────────────────────── */
.skeleton { background: rgba(255,255,255,0.04); border-radius: 6px; animation: shimmer 1.8s ease-in-out infinite; }
.skel-card { height: 95px; border-radius: 16px; }
@keyframes shimmer {
  0%,100% { opacity: 1; }
  50%      { opacity: 0.35; }
}

/* ── Footer ──────────────────────────────────────────────────────────────── */
.footer { margin-top: 60px; font-size: 11px; color: #1e293b; text-align: center; letter-spacing: 0.05em; }

@media (max-width: 600px) {
  .wrap { padding: 28px 18px 50px; }
  .greeting { font-size: 26px; }
  .header { flex-direction: column; gap: 16px; }
}
</style>
</head>

</div>

<div class="footer" id="footer"></div>

</div><!-- /.wrap -->

let companyOffset = 0;

// ── Helpers ───────────────────────────────────────────────────────────────────

function toGBP(price, currency) {
  if (price == null) return null;
  return currency === "GBp" ? price / 100 : price;
}

function fmtPrice(price, currency) {
  if (price == null) return "—";
  const p = toGBP(price, currency);
  if (p > 10000) return p.toLocaleString("en-GB", { maximumFractionDigits: 0 });
  if (p > 10)    return "£" + p.toLocaleString("en-GB", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  return "£" + p.toFixed(4);
}

function fmtChange(change) {
  if (change == null) return "";
  const cls   = change >= 0 ? "up" : "down";
  const arrow = change >= 0 ? "▲" : "▼";
  const sign  = change >= 0 ? "+" : "";
  return `<div class="change ${cls}">${arrow} ${sign}${change.toFixed(2)}%</div>`;
}

function getCompany() {
  const start  = new Date(new Date().getFullYear(), 0, 0);
  const dayNum = Math.floor((Date.now() - start) / 86400000);
  return COMPANIES[(dayNum + companyOffset) % COMPANIES.length];
}

// ── Data fetching ─────────────────────────────────────────────────────────────

// Prices + fixtures come from the Vercel serverless function (no CORS issues)
let _serverData = null;
async function getServerData() {
  if (_serverData) return _serverData;
  try {
    const res = await fetch('/api/data');
    _serverData = await res.json();
  } catch (_) {
    _serverData = { prices: {}, fixtures: [] };
  }
  return _serverData;
}


// ── Rendering ─────────────────────────────────────────────────────────────────

function priceCard(name, data, units) {
  const { price, change, currency } = data;
  const gbp = toGBP(price, currency);
  const holdingHtml = (units && gbp) ? `<div class="holding">£${(units * gbp).toLocaleString("en-GB", { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</div>` : "";
  return `<div class="card">
  <div class="label">${name}</div>
  <div class="value">${fmtPrice(price, currency)}</div>
  ${holdingHtml}
  ${fmtChange(change)}
</div>`;
}

function renderPortfolio(portfolio) {
  document.getElementById("portfolio").innerHTML =
    Object.entries(portfolio).map(([n, d]) => priceCard(n, d, UNITS[n])).join("");

  let total = 0, daily = 0;
  for (const [name, data] of Object.entries(portfolio)) {
    const gbp = toGBP(data.price, data.currency);
    const u   = UNITS[name] || 0;
    if (gbp && u) { const val = gbp * u; total += val; daily += val * (data.change || 0) / 100; }
  }
  if (total) {
    const color = daily >= 0 ? "#22c55e" : "#ef4444";
    const sign  = daily >= 0 ? "+" : "";
    document.getElementById("portfolio-total").innerHTML =
      `<div class="total">Total <span class="total-val">£${total.toLocaleString("en-GB", { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</span>` +
      `<span class="total-daily" style="color:${color}">${sign}£${Math.abs(daily).toLocaleString("en-GB", { minimumFractionDigits: 2, maximumFractionDigits: 2 })} today</span></div>`;
  }
}

function renderMarkets(indices) {
  document.getElementById("markets").innerHTML =
    Object.entries(indices).map(([n, d]) => priceCard(n, d, null)).join("");
}

function renderFixtures(fixtures) {
  if (!fixtures.length) { document.getElementById("fixtures").innerHTML = '<p class="empty">Fixtures unavailable</p>'; return; }
  document.getElementById("fixtures").innerHTML = fixtures.map(f => `
<div class="fixture${f.chelsea ? " chelsea" : ""}">
  <div class="fix-meta">${f.gw ? `<span class="gw">GW${f.gw}</span>` : ""}<span class="fix-time">${f.time}</span></div>
  <div class="fix-teams">${f.home} <em>vs</em> ${f.away}</div>
</div>`).join("");
}

function renderCompany() {
  const c = getCompany();
  document.getElementById("company").innerHTML = `
<div class="company-card">
  <div class="company-tag">${c.tag}</div>
  <div class="company-name">${c.name}</div>
  <div class="company-what">${c.what}</div>
  <div class="company-why">${c.why}</div>
  <div class="company-footer">
    <a class="company-link" href="https://${c.url}" target="_blank" rel="noopener">${c.url} →</a>
    <button class="company-next" onclick="companyOffset++;renderCompany()">Next company →</button>
  </div>
</div>`;
}

function renderNews(allNews) {
  document.getElementById("news").innerHTML = Object.entries(allNews).map(([name, items]) => {
    if (!items.length) return `<div class="news-col"><div class="col-title">${name}</div><p class="empty">Unavailable</p></div>`;
    const stories = items.map(i => `<a class="story" href="${i.link}" target="_blank" rel="noopener">${i.title}</a>`).join("");
    return `<div class="news-col"><div class="col-title">${name}</div>${stories}</div>`;
  }).join("");
}

// ── Init ──────────────────────────────────────────────────────────────────────

async function init() {
  // Header
  const now    = new Date();
  const hour   = now.getHours();
  const greet  = hour < 12 ? "Good morning" : hour < 17 ? "Good afternoon" : "Good evening";
  const dateStr = now.toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
  const timeStr = now.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
  document.getElementById("greeting").textContent  = `${greet}, Jonno.`;
  document.getElementById("dateline").textContent  = `${dateStr} · Updated at ${timeStr}`;
  document.getElementById("footer").textContent    = `briefing · ${dateStr} · ${timeStr}`;

  // Company (no network needed)
  renderCompany();

  // Everything comes from the server — prices, news, and fixtures in one call
  getServerData().then(data => {
    const empty = { price: null, change: null, currency: "" };
    renderPortfolio(Object.fromEntries(Object.keys(PORTFOLIO).map(n => [n, data.prices[n] || empty])));
    renderMarkets(Object.fromEntries(Object.keys(INDICES).map(n => [n, data.prices[n] || empty])));
    renderNews(data.news || {});
    renderFixtures((data.fixtures || []).map(f => {
      const dt  = new Date(f.kickoff);
      const day = dt.toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" });
      const tm  = dt.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
      return { ...f, time: `${day} · ${tm}` };
    }));
  });
}

init();
</script>
