<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Briefing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,900;1,900&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:     #ffffff;
  --panel:  #edf0f8;
  --ink:    #111111;
  --ink-2:  #2d2d2d;
  --ink-3:  #6b7280;
  --ink-4:  #dde1ee;
  --ink-5:  #edf0f8;
  --accent: #E8451A;
  --green:  #16a34a;
  --red:    #dc2626;
  --r:      14px;
  --f-d: 'Playfair Display', Georgia, serif;
  --f-m: 'JetBrains Mono', monospace;
  --f-b: 'Plus Jakarta Sans', -apple-system, sans-serif;
}

html { scroll-behavior: smooth; }
body {
  font-family: var(--f-b);
  background: var(--bg);
  color: var(--ink);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

/* ── Page loader ─────────────────────────────────────────────── */
#page-bar {
  position: fixed; top: 0; left: 0; right: 0;
  height: 3px; background: var(--accent);
  width: 0; z-index: 9999;
  transition: width 0.4s ease, opacity 0.4s ease;
}

/* ── Layout ──────────────────────────────────────────────────── */
.wrap { max-width: 1160px; margin: 0 auto; padding: 32px 40px 80px; }

/* ── Header ──────────────────────────────────────────────────── */
.header {
  display: flex; align-items: flex-start;
  justify-content: space-between;
  background: #111111;
  border-radius: 20px;
  padding: 44px 52px;
  margin-bottom: 0;
}
.greeting {
  font-family: var(--f-d);
  font-size: clamp(2.2rem, 4.5vw, 3.4rem);
  font-weight: 900; color: #ffffff;
  letter-spacing: -0.03em; line-height: 1.05;
}
.header-meta { margin-top: 10px; display: flex; flex-direction: column; gap: 4px; }
.dateline, .weather-line {
  font-family: var(--f-m); font-size: 11px;
  color: rgba(255,255,255,0.4); letter-spacing: 0.02em;
}
.header-right {
  display: flex; flex-direction: column;
  align-items: flex-end; gap: 8px;
  flex-shrink: 0; padding-top: 4px;
}
.live-badge {
  display: flex; align-items: center; gap: 6px;
  font-family: var(--f-m); font-size: 11px; font-weight: 500;
  letter-spacing: 0.1em; text-transform: uppercase; color: rgba(255,255,255,0.45);
}
.live-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--accent); flex-shrink: 0;
  animation: pulse 2s ease-in-out infinite;
}
@keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.3;} }

/* ── Section ─────────────────────────────────────────────────── */
.section {
  margin-top: 56px;
  opacity: 0; transform: translateY(14px);
  transition: opacity 0.5s ease, transform 0.5s ease;
}
.section.visible { opacity: 1; transform: translateY(0); }
.lbl {
  font-family: var(--f-m); font-size: 11px; font-weight: 500;
  letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--ink-3); margin-bottom: 18px;
}

/* ── Ticker ──────────────────────────────────────────────────── */
.ticker-outer {
  background: var(--ink); margin: 24px -40px 0;
  padding: 11px 0; overflow: hidden; position: relative;
}
.ticker-outer::before, .ticker-outer::after {
  content: ''; position: absolute; top:0; bottom:0;
  width: 72px; z-index: 2; pointer-events: none;
}
.ticker-outer::before { left:0; background: linear-gradient(to right, var(--ink), transparent); }
.ticker-outer::after  { right:0; background: linear-gradient(to left, var(--ink), transparent); }
.ticker-track {
  display: flex; white-space: nowrap;
  animation: tickerMove 50s linear infinite;
}
.ticker-track:hover { animation-play-state: paused; }
@keyframes tickerMove { from{transform:translateX(0);} to{transform:translateX(-50%);} }
.tick-item {
  display: inline-flex; align-items: center; gap: 9px;
  padding: 0 26px; border-right: 1px solid rgba(255,255,255,0.08);
}
.t-name  { font-family:var(--f-m); font-size:10px; color:rgba(255,255,255,0.3); letter-spacing:0.1em; text-transform:uppercase; }
.t-price { font-family:var(--f-m); font-size:13px; font-weight:500; color:#fff; }
.t-chg   { font-family:var(--f-m); font-size:11px; }
.t-chg.up{color:#4ade80;} .t-chg.down{color:#f87171;}

/* ── Markets ─────────────────────────────────────────────────── */
.indices-strip {
  display: flex; background: var(--panel);
  border-radius: var(--r); overflow: hidden; margin-bottom: 12px;
}
.idx-cell {
  flex: 1; display: flex; align-items: center;
  gap: 10px; padding: 16px 20px;
  border-right: 1px solid rgba(0,0,0,0.06);
}
.idx-cell:last-child { border-right: none; }
.idx-name  { font-family:var(--f-m); font-size:10px; color:var(--ink-3); letter-spacing:0.08em; text-transform:uppercase; white-space:nowrap; }
.idx-price { font-family:var(--f-m); font-size:15px; font-weight:500; color:var(--ink); }
.idx-chg   { font-family:var(--f-m); font-size:11px; margin-left:auto; white-space:nowrap; }
.idx-chg.up{color:var(--green);} .idx-chg.down{color:var(--red);}

.movers-grid {
  display: grid; grid-template-columns: 1fr 1fr;
  background: var(--panel); border-radius: var(--r); overflow: hidden;
}
.movers-col:first-child { border-right: 1px solid rgba(0,0,0,0.06); }
.movers-head {
  font-family:var(--f-m); font-size:10px; font-weight:500;
  letter-spacing:0.12em; text-transform:uppercase; color:var(--ink-3);
  padding: 13px 20px; border-bottom: 1px solid rgba(0,0,0,0.06);
  background: rgba(0,0,0,0.04);
}
.mover-row {
  display: grid; grid-template-columns: 1fr auto auto;
  gap: 14px; align-items: center;
  padding: 12px 20px; border-bottom: 1px solid rgba(0,0,0,0.06);
  opacity: 0;
  animation: fadeIn 0.3s ease forwards;
}
@keyframes fadeIn { to{ opacity:1; } }
.mover-row:last-child { border-bottom: none; }
.m-name  { font-family:var(--f-b); font-size:13px; font-weight:600; color:var(--ink); }
.m-price { font-family:var(--f-m); font-size:12px; color:var(--ink-3); }
.m-chg   { font-family:var(--f-m); font-size:13px; font-weight:500; min-width:58px; text-align:right; }
.m-chg.up{color:var(--green);} .m-chg.down{color:var(--red);}

/* ── Carousel ────────────────────────────────────────────────── */
.carousel {
  background: var(--panel);
  border-radius: var(--r); overflow: hidden;
}
.carousel-tabs {
  display: flex; border-bottom: 1px solid rgba(0,0,0,0.06);
  overflow-x: auto; scrollbar-width: none;
}
.carousel-tabs::-webkit-scrollbar { display: none; }
.ctab {
  flex: 1; min-width: 0; padding: 12px 14px;
  background: transparent; border: none;
  border-right: 1px solid rgba(0,0,0,0.06); cursor: pointer;
  font-family: var(--f-m); font-size: 10px; font-weight: 500;
  letter-spacing: 0.04em; color: var(--ink-3);
  text-align: left; white-space: nowrap; overflow: hidden;
  text-overflow: ellipsis;
  transition: background 0.15s, color 0.15s;
}
.ctab:last-child { border-right: none; }
.ctab:hover  { background: rgba(255,255,255,0.5); color: var(--ink-2); }
.ctab.active { background: rgba(255,255,255,0.8); color: var(--ink); }
.carousel-body {
  display: grid; grid-template-columns: 1fr 148px;
  gap: 32px; padding: 28px 32px;
  min-height: 140px; align-items: start;
}
.c-tag {
  display: inline-block; font-family: var(--f-m);
  font-size: 9px; font-weight: 500; letter-spacing: 0.12em;
  text-transform: uppercase; color: var(--accent);
  background: rgba(232,69,26,0.08);
  padding: 3px 10px; border-radius: 99px; margin-bottom: 10px;
}
.c-name {
  font-family: var(--f-d); font-size: 26px; font-weight: 900;
  color: var(--ink); line-height: 1.1; letter-spacing: -0.02em;
  margin-bottom: 9px;
}
.c-desc { font-family: var(--f-b); font-size: 14px; color: var(--ink-2); line-height: 1.6; margin-bottom: 14px; }
.c-link { font-family: var(--f-m); font-size: 12px; color: var(--ink-3); text-decoration: none; transition: color 0.12s; }
.c-link:hover { color: var(--accent); }
.c-spark-wrap { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; padding-top: 4px; }
.c-spark-lbl  { font-family: var(--f-m); font-size: 10px; letter-spacing: 0.06em; }
.carousel-progress { height: 3px; background: rgba(0,0,0,0.08); }
.carousel-bar      { height: 3px; width: 0; background: var(--accent); }

/* ── Fixtures ────────────────────────────────────────────────── */
.fixtures-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.fixture {
  background: var(--panel); border-radius: var(--r);
  padding: 18px 22px;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
  cursor: default;
}
.fixture:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(0,0,0,0.08); }
.fixture.chelsea { border-left: 3px solid var(--accent); }
.fix-meta { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
.gw {
  font-family: var(--f-m); font-size: 9px; font-weight: 500;
  letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--ink-3); background: rgba(0,0,0,0.07);
  padding: 2px 8px; border-radius: 99px;
}
.fix-time { font-family: var(--f-m); font-size: 11px; color: var(--ink-3); }
.fix-matchup { display: flex; align-items: center; gap: 8px; }
.fix-team   { display: flex; align-items: center; gap: 7px; flex: 1; min-width: 0; }
.fix-team-r { justify-content: flex-end; }
.fix-badge  { width: 22px; height: 22px; object-fit: contain; flex-shrink: 0; }
.fix-name   { font-family: var(--f-b); font-size: 13px; font-weight: 600; color: var(--ink); line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fix-vs     { font-family: var(--f-m); font-size: 10px; color: var(--ink-3); flex-shrink: 0; }
.fix-odds {
  display: flex; gap: 6px; margin-top: 12px;
  padding-top: 12px; border-top: 1px solid rgba(0,0,0,0.06);
}
.odds-btn {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; gap: 2px; padding: 7px 4px;
  background: rgba(255,255,255,0.75); border: none;
  border-radius: 8px;
  transition: background 0.15s, transform 0.15s;
  cursor: default;
}
.odds-btn:hover { background: #fff; transform: translateY(-1px); }
.odds-lbl { font-family: var(--f-m); font-size: 9px; color: var(--ink-3); letter-spacing: 0.06em; }
.odds-val { font-family: var(--f-m); font-size: 13px; font-weight: 500; color: var(--ink); }
.fix-toggle {
  display: flex; align-items: center; justify-content: center;
  margin-top: 12px; width: 100%; padding: 12px 16px;
  background: var(--panel); border: none;
  border-radius: 999px; cursor: pointer;
  font-family: var(--f-m); font-size: 11px; font-weight: 500;
  letter-spacing: 0.08em; color: var(--ink-3);
  transition: background 0.15s, color 0.15s, transform 0.15s;
}
.fix-toggle:hover { background: #dde2f0; color: var(--ink-2); transform: translateY(-1px); }

/* ── Portfolio ────────────────────────────────────────────────── */
.portfolio-compact { background: var(--panel); border-radius: var(--r); overflow: hidden; }
.pc-total-row {
  display: grid; grid-template-columns: 1fr auto auto;
  gap: 20px; align-items: center;
  padding: 20px 24px; background: rgba(0,0,0,0.04);
  border-bottom: 1px solid rgba(0,0,0,0.06);
}
.pc-total-label { font-family:var(--f-m); font-size:10px; font-weight:500; letter-spacing:0.12em; text-transform:uppercase; color:var(--ink-3); }
.pc-total-val   { font-family:var(--f-d); font-size:1.9rem; font-weight:900; color:var(--ink); letter-spacing:-0.02em; line-height:1; }
.pc-total-chg   { font-family:var(--f-m); font-size:13px; font-weight:500; }
.pc-total-chg.up{color:var(--green);} .pc-total-chg.down{color:var(--red);}
.pc-row {
  display: grid; grid-template-columns: 1fr auto auto;
  gap: 20px; align-items: center;
  padding: 15px 24px; border-bottom: 1px solid rgba(0,0,0,0.06);
}
.pc-row:last-child { border-bottom: none; }
.pc-name { font-family:var(--f-b); font-size:14px; font-weight:600; color:var(--ink); }
.pc-sub  { font-family:var(--f-m); font-size:10px; color:var(--ink-3); margin-top:3px; }
.pc-val  { font-family:var(--f-m); font-size:14px; font-weight:500; color:var(--ink); text-align:right; }
.pc-chg  { font-family:var(--f-m); font-size:12px; min-width:64px; text-align:right; }
.pc-chg.up{color:var(--green);} .pc-chg.down{color:var(--red);}

/* ── Golf ─────────────────────────────────────────────────────── */
.golf-dates {
  display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px;
}
.golf-date-btn {
  display: flex; flex-direction: column; align-items: center;
  padding: 12px 20px; background: var(--panel); border: none;
  border-radius: 12px; text-decoration: none;
  transition: background 0.15s, transform 0.15s;
}
.golf-date-btn:hover { background: #dde2f0; transform: translateY(-2px); }
.golf-date-day  { font-family: var(--f-b); font-size: 13px; font-weight: 700; color: var(--ink); }
.golf-date-date { font-family: var(--f-m); font-size: 10px; color: var(--ink-3); margin-top: 2px; }
.golf-courses-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px;
}
.golf-course {
  background: var(--panel); border: none; border-radius: var(--r);
  padding: 16px 20px; text-decoration: none;
  transition: background 0.15s, transform 0.15s; display: block;
}
.golf-course:hover { background: #dde2f0; transform: translateY(-2px); }
.gc-name { font-family: var(--f-b); font-size: 13px; font-weight: 600; color: var(--ink); margin-bottom: 4px; }
.gc-meta { font-family: var(--f-m); font-size: 10px; color: var(--ink-3); letter-spacing: 0.04em; }
.gc-cta  { font-family: var(--f-m); font-size: 10px; color: var(--accent); margin-top: 8px; letter-spacing: 0.02em; }

/* ── News ─────────────────────────────────────────────────────── */
.news-grid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 1px; background: rgba(0,0,0,0.07);
  border-radius: var(--r); overflow: hidden;
}
.news-col { background: var(--panel); padding: 24px 26px; }
.news-col-title {
  font-family: var(--f-m); font-size: 10px; font-weight: 500;
  letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-3);
  margin-bottom: 14px; padding-bottom: 12px;
  border-bottom: 1px solid rgba(0,0,0,0.06);
}
.story {
  display: grid; grid-template-columns: 18px 1fr;
  gap: 10px; padding: 10px 0;
  border-bottom: 1px solid rgba(0,0,0,0.06);
  text-decoration: none; color: var(--ink-2);
  transition: color 0.12s;
}
.story:last-child  { border-bottom: none; padding-bottom: 0; }
.story:first-child { padding-top: 0; }
.story:hover { color: var(--ink); }
.s-n { font-family:var(--f-m); font-size:10px; color:rgba(0,0,0,0.15); padding-top:3px; font-weight:500; transition: color 0.12s; }
.story:hover .s-n { color: var(--ink-3); }
.s-t { font-family:var(--f-b); font-size:13px; line-height:1.5; }
.story.lead .s-t { font-size:14px; font-weight:700; color:var(--ink); }
.story.lead .s-n { color:var(--accent); font-weight:500; }

/* ── Skeleton ─────────────────────────────────────────────────── */
.skel { background: rgba(0,0,0,0.07); border-radius: 8px; animation: shimmer 1.6s ease-in-out infinite; }
@keyframes shimmer { 0%,100%{opacity:1;} 50%{opacity:0.45;} }

/* ── Footer ───────────────────────────────────────────────────── */
.footer { margin-top:56px; padding-top:18px; border-top:1px solid rgba(0,0,0,0.07); font-family:var(--f-m); font-size:10px; color:var(--ink-3); letter-spacing:0.08em; }

/* ── FPL Team ─────────────────────────────────────────────────── */
.fpl-header {
  background: var(--panel); border-radius: var(--r);
  padding: 20px 26px; margin-bottom: 10px;
  display: flex; justify-content: space-between; align-items: flex-start; gap: 16px;
}
.fpl-team-name { font-family: var(--f-d); font-size: 1.4rem; font-weight: 900; color: var(--ink); line-height: 1.1; }
.fpl-stat-lbl { font-family: var(--f-m); font-size: 10px; color: var(--ink-3); letter-spacing: 0.06em; text-transform: uppercase; margin-top: 8px; }
.fpl-stat-val { font-family: var(--f-m); font-size: 15px; font-weight: 500; color: var(--ink); }
.fpl-pitch { background: var(--panel); border-radius: var(--r); padding: 20px 12px; }
.fpl-pos-section { margin-bottom: 16px; }
.fpl-pos-label {
  font-family: var(--f-m); font-size: 9px; letter-spacing: 0.12em;
  text-transform: uppercase; color: var(--ink-3);
  text-align: center; margin-bottom: 8px;
}
.fpl-row { display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; }
.fpl-player {
  display: flex; flex-direction: column; align-items: center;
  gap: 3px; width: 72px; position: relative;
}
.fpl-player.bench { opacity: 0.65; }
.fpl-kit { width: 38px; height: 38px; object-fit: contain; }
.fpl-badges { display: flex; gap: 3px; justify-content: center; min-height: 16px; }
.fpl-cap {
  background: var(--ink); color: #fff; border-radius: 50%;
  width: 16px; height: 16px; font-family: var(--f-m);
  font-size: 9px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
}
.fpl-cap.vc { background: var(--ink-3); }
.fpl-pname {
  font-family: var(--f-b); font-size: 11px; font-weight: 600; color: var(--ink);
  text-align: center; line-height: 1.2; max-width: 70px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.fpl-ptag { font-family: var(--f-m); font-size: 9px; color: var(--ink-3); letter-spacing: 0.03em; }
.fpl-doubt { font-family: var(--f-m); font-size: 9px; color: #f59e0b; }
.fpl-bench-strip {
  margin-top: 12px; padding-top: 12px; border-top: 1px solid rgba(0,0,0,0.06);
}
.fpl-bench-label {
  font-family: var(--f-m); font-size: 9px; letter-spacing: 0.12em;
  text-transform: uppercase; color: var(--ink-3); text-align: center; margin-bottom: 8px;
}

/* ── Weather Widget ──────────────────────────────────────────── */
.weather-card {
  background: var(--panel); border-radius: var(--r);
  padding: 24px 32px; display: flex;
  align-items: center; justify-content: space-between;
  gap: 24px; cursor: default;
  transition: transform 0.2s, box-shadow 0.2s;
}
.weather-card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.07); }
.wx-left { display: flex; flex-direction: column; }
.wx-temp {
  font-family: var(--f-d); font-size: 2.8rem; font-weight: 900;
  color: var(--ink); letter-spacing: -0.04em; line-height: 1;
}
.wx-unit { font-family: var(--f-m); font-size: 1.1rem; color: var(--ink-3); font-weight: 400; }
.wx-desc { font-family: var(--f-b); font-size: 15px; font-weight: 600; color: var(--ink-2); margin-top: 7px; }
.wx-meta { font-family: var(--f-m); font-size: 11px; color: var(--ink-3); margin-top: 5px; letter-spacing: 0.01em; }
.wx-icon { flex-shrink: 0; }

/* Sun: rays spin */
.weather-card:hover .wx-svg-sun { animation: wxSpin 9s linear infinite; transform-origin: center; }
@keyframes wxSpin { to { transform: rotate(360deg); } }

/* Cloud: drift */
.weather-card:hover .wx-cloud-body { animation: wxDrift 2.5s ease-in-out infinite alternate; }
@keyframes wxDrift { from { transform: translateX(-4px); } to { transform: translateX(4px); } }

/* Rain/snow drops/flakes: fall */
.weather-card:hover .wx-d1 { animation: wxFall 0.9s linear infinite; }
.weather-card:hover .wx-d2 { animation: wxFall 0.9s linear infinite 0.3s; }
.weather-card:hover .wx-d3 { animation: wxFall 0.9s linear infinite 0.6s; }
@keyframes wxFall { 0%{transform:translateY(-2px);opacity:0} 20%{opacity:1} 100%{transform:translateY(16px);opacity:0} }

/* Snow flakes */
.weather-card:hover .wx-f1 { animation: wxFlake 1.4s ease-in infinite; }
.weather-card:hover .wx-f2 { animation: wxFlake 1.4s ease-in infinite 0.47s; }
.weather-card:hover .wx-f3 { animation: wxFlake 1.4s ease-in infinite 0.93s; }
@keyframes wxFlake { 0%{transform:translateY(-2px) rotate(0deg);opacity:0} 20%{opacity:1} 100%{transform:translateY(18px) rotate(120deg);opacity:0} }

/* Storm bolt */
.weather-card:hover .wx-bolt { animation: wxBolt 1.8s ease-in-out infinite; }

// ── Helpers ────────────────────────────────────────────────────────────────────
function toGBP(price, currency) {
  if (price == null) return null;
  if (currency === 'GBp') return price / 100;
  if (currency === 'USD') return price / GBPUSD;
  return price;
}

function fmtGBP(val, decimals = 2) {
  if (val == null) return '—';
  return '£' + val.toLocaleString('en-GB', { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
}

function fmtPrice(price, currency) {
  if (price == null) return '—';
  const p   = toGBP(price, currency);
  const sym = (currency === 'GBp' || currency === 'GBP') ? '£' : '';
  if (p > 10000) return sym + p.toLocaleString('en-GB', { maximumFractionDigits: 0 });
  if (p > 10)    return sym + p.toLocaleString('en-GB', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  return sym + p.toFixed(4);
}

// ── Count-up animation ─────────────────────────────────────────────────────────
function countUp(el, target, prefix = '£', decimals = 2, ms = 750) {
  if (target == null || isNaN(target)) { el.textContent = '—'; return; }
  const start = performance.now();
  const from  = target * 0.82;
  function step(now) {
    const p    = Math.min((now - start) / ms, 1);
    const ease = 1 - Math.pow(1 - p, 3);
    const val  = from + (target - from) * ease;
    el.textContent = prefix + val.toLocaleString('en-GB', { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
    if (p < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

async function fetchWeather() {
  try {
    const r = await fetch(
      'https://api.open-meteo.com/v1/forecast?latitude=51.4214&longitude=-0.2062' +
      '&current=temperature_2m,weather_code' +
      '&daily=temperature_2m_max,uv_index_max' +
      '&timezone=Europe%2FLondon'
    );
    const d    = await r.json();
    const temp = Math.round(d.current.temperature_2m);
    const peak = Math.round(d.daily.temperature_2m_max[0]);
    const uv   = Math.round(d.daily.uv_index_max[0]);
    const code = d.current.weather_code;
    const desc = WMO[code] || '';
    const type = wxType(code);
    const iconEl = document.getElementById('wx-icon');
    const tempEl = document.getElementById('wx-temp');
    const descEl = document.getElementById('wx-desc');
    const metaEl = document.getElementById('wx-meta');
    if (iconEl) iconEl.innerHTML = wxSVG(type);
    if (tempEl) tempEl.innerHTML = `${temp}<span class="wx-unit">°C</span>`;
    if (descEl) descEl.textContent = desc;
    if (metaEl) metaEl.textContent = `Wimbledon · Peaks ${peak}°C · UV ${uv} (${UV_LABEL(uv)})`;
  } catch (_) {}
}

// ── Sparkline ──────────────────────────────────────────────────────────────────
function makeSparkline(seed) {
  const W = 148, H = 56, N = 24;
  const pts = []; let val = 30 + (seed % 25), r = seed;
  for (let i = 0; i < N; i++) {
    r = (r * 1664525 + 1013904223) & 0x7fffffff;
    val = Math.max(5, Math.min(95, val + (r / 0x7fffffff - 0.43) * 10));
    pts.push(val);
  }
  const minV = Math.min(...pts), maxV = Math.max(...pts), range = maxV - minV || 10;
  const coords = pts.map((v, i) =>
    `${(2 + (i / (N - 1)) * (W - 4)).toFixed(1)} ${(H - 2 - ((v - minV) / range) * (H - 6)).toFixed(1)}`
  );
  return { d: 'M ' + coords.join(' L '), isUp: pts[N - 1] >= pts[0] };
}

// ── Portfolio ──────────────────────────────────────────────────────────────────
function renderPortfolio(portfolio) {
  let total = 0, daily = 0;
  const rows = [];
  for (const [name, data] of Object.entries(portfolio)) {
    const gbp = toGBP(data.price, data.currency);
    const u   = UNITS[name] || 0;
    let val = null, chg = null;
    if (gbp && u) {
      val = gbp * u; chg = data.change || 0;
      total += val; daily += val * chg / 100;
    }
    rows.push({ name, val, chg, price: gbp, units: u });
  }

  countUp(document.getElementById('pc-total'), total);

  if (total) {
    const sign = daily >= 0 ? '+' : '';
    const el   = document.getElementById('pc-chg');
    el.textContent = `${sign}${fmtGBP(Math.abs(daily))} today`;
    el.className   = 'pc-total-chg ' + (daily >= 0 ? 'up' : 'down');
  }

  document.getElementById('pc-holdings').innerHTML = rows.map(({ name, val, chg, price, units }) => {
    const priceStr = price ? (price > 1 ? fmtGBP(price) : '£' + price.toFixed(4)) + ' / unit' : '';
    const chgStr   = chg != null ? (chg >= 0 ? '+' : '') + chg.toFixed(2) + '%' : '';
    const cls      = chg != null ? (chg >= 0 ? 'up' : 'down') : '';
    return `<div class="pc-row">
  <div><div class="pc-name">${name}</div><div class="pc-sub">${units} units · ${priceStr}</div></div>
  <span class="pc-val">${val ? fmtGBP(val) : '—'}</span>
  <span class="pc-chg ${cls}">${chgStr}</span>
</div>`;
  }).join('');
}

// ── Movers ─────────────────────────────────────────────────────────────────────
function renderMovers(prices) {
  const all = MOVER_NAMES
    .map(n => ({ name: n, ...(prices[n] || { price: null, change: null, currency: '' }) }))
    .filter(m => m.price != null && m.change != null)
    .sort((a, b) => b.change - a.change);

  const gainers = all.filter(m => m.change >= 0).slice(0, 5);
  const losers  = all.filter(m => m.change < 0).slice(-5).reverse();

  function row(m, delay) {
    const p   = toGBP(m.price, m.currency);
    const sym = (m.currency === 'GBp' || m.currency === 'GBP') ? '£' : '';
    const ps  = sym + (p > 100
      ? p.toLocaleString('en-GB', { maximumFractionDigits: 0 })
      : p.toLocaleString('en-GB', { minimumFractionDigits: 2, maximumFractionDigits: 2 }));
    const cls  = m.change >= 0 ? 'up' : 'down';
    const sign = m.change >= 0 ? '+' : '';
    return `<div class="mover-row" style="animation-delay:${delay}ms">
  <span class="m-name">${m.name}</span>
  <span class="m-price">${ps}</span>
  <span class="m-chg ${cls}">${sign}${m.change.toFixed(2)}%</span>
</div>`;
  }

  const empty = `<div class="mover-row"><span class="m-name" style="color:var(--ink-3)">No data</span></div>`;
  document.getElementById('movers-up').innerHTML = gainers.length ? gainers.map((m, i) => row(m, i * 60)).join('') : empty;
  document.getElementById('movers-dn').innerHTML = losers.length  ? losers.map((m, i) => row(m, i * 60)).join('') : empty;
}

// ── Ticker ─────────────────────────────────────────────────────────────────────
function buildTicker(prices) {
  const all   = [...INDEX_NAMES, ...MOVER_NAMES];
  const items = all.map(n => {
    const d = prices[n];
    if (!d || d.price == null) return null;
    const p   = toGBP(d.price, d.currency);
    const sym = (d.currency === 'GBp' || d.currency === 'GBP') ? '£' : '';
    const ps  = sym + (p > 1000
      ? p.toLocaleString('en-GB', { maximumFractionDigits: 0 })
      : p.toLocaleString('en-GB', { minimumFractionDigits: 2, maximumFractionDigits: 2 }));
    const cls = (d.change || 0) >= 0 ? 'up' : 'down';
    const chg = d.change != null ? (d.change >= 0 ? '+' : '') + d.change.toFixed(2) + '%' : '';
    return `<span class="tick-item"><span class="t-name">${n}</span><span class="t-price">${ps}</span><span class="t-chg ${cls}">${chg}</span></span>`;
  }).filter(Boolean);
  if (!items.length) return;
  const half = items.join('');
  document.getElementById('ticker-track').innerHTML = half + half;
}

// ── Carousel ───────────────────────────────────────────────────────────────────
const CAROUSEL_SIZE = 5, CAROUSEL_MS = 12000;
let cIdx = 0, cRafId = null, cRafTs = null, cCos = [];

function initCarousel() {
  const dayNum = Math.floor((Date.now() - new Date(new Date().getFullYear(), 0, 0)) / 86400000);
  cCos = Array.from({ length: CAROUSEL_SIZE }, (_, i) => COMPANIES[(dayNum + i) % COMPANIES.length]);
  renderCarouselTabs(0);
  showSlide(0);
  startCycle();
}

function renderCarouselTabs(active) {
  document.getElementById('carousel-tabs').innerHTML = cCos.map((c, i) =>
    `<button class="ctab${i === active ? ' active' : ''}" onclick="jumpCarousel(${i})">${c.name}</button>`
  ).join('');
}

function showSlide(idx) {
  cIdx = idx;
  document.querySelectorAll('.ctab').forEach((b, i) => b.classList.toggle('active', i === idx));
  const c = cCos[idx];
  const { d, isUp } = makeSparkline(COMPANIES.indexOf(c));
  const col = isUp ? '#16a34a' : '#dc2626';
  document.getElementById('carousel-body').innerHTML = `<div>
  <div class="c-tag">${c.tag}</div>
  <div class="c-name">${c.name}</div>
  <div class="c-desc">${c.what}</div>
  <a class="c-link" href="https://${c.url}" target="_blank" rel="noopener">${c.url} →</a>
</div>
<div class="c-spark-wrap">
  <svg width="148" height="56" viewBox="0 0 148 56" fill="none">
    <path d="${d}" stroke="${col}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <span class="c-spark-lbl" style="color:${col}">${isUp ? 'Momentum up' : 'Volatile'}</span>
</div>`;
}

function startCycle() {
  cancelAnimationFrame(cRafId);
  cRafTs = null;
  const bar = document.getElementById('carousel-bar');
  if (bar) bar.style.width = '0%';
  function tick(ts) {
    if (!cRafTs) cRafTs = ts;
    const pct = Math.min((ts - cRafTs) / CAROUSEL_MS, 1);
    if (bar) bar.style.width = (pct * 100).toFixed(1) + '%';
    if (pct < 1) { cRafId = requestAnimationFrame(tick); }
    else { showSlide((cIdx + 1) % CAROUSEL_SIZE); startCycle(); }
  }
  cRafId = requestAnimationFrame(tick);
}

function jumpCarousel(idx) { cancelAnimationFrame(cRafId); showSlide(idx); startCycle(); }

  const starting = fpl.picks.filter(p => p.slot <= 11);
  const bench    = fpl.picks.filter(p => p.slot > 11).sort((a, b) => a.slot - b.slot);

  function kitUrl(p) {
    if (!p.teamCode) return '';
    const suffix = p.pos === 1 ? '_1' : '';
    return `https://fantasy.premierleague.com/dist/img/shirts/standard/shirt_${p.teamCode}${suffix}-66.png`;

  function playerCard(p, isBench) {
    const cap  = p.isCap ? '<div class="fpl-cap">C</div>' : p.isVC ? '<div class="fpl-cap vc">V</div>' : '';
    const doubt = (p.chance !== null && p.chance < 100) ? `<span class="fpl-doubt">⚠ ${p.chance}%</span>` : '';

  const byPos = [1, 2, 3, 4].map(pos => starting.filter(p => p.pos === pos));
  const formation = byPos.slice(1).map(g => g.length).join('-');
  const rankStr = fpl.overallRank ? fpl.overallRank.toLocaleString('en-GB') : '—';

  el.innerHTML = `
    <div class="fpl-header">
      <div>
        <div class="fpl-team-name">${fpl.teamName}</div>
        <div class="fpl-stat-lbl">Overall rank</div>

        <div class="fpl-stat-lbl" style="margin-top:6px">Formation · Bank</div>

      </div>
    </div>
    <div class="fpl-pitch">
      ${byPos.map((group, i) => group.length ? `
        <div class="fpl-pos-section">
          <div class="fpl-pos-label">${POS[i + 1]}</div>
          <div class="fpl-row">${group.map(p => playerCard(p, false)).join('')}</div>
        </div>` : '').join('')}

  setBar(10);

  const now     = new Date();
  const hour    = now.getHours();
  const greet   = hour < 12 ? 'Good morning' : hour < 17 ? 'Good afternoon' : 'Good evening';
  const dateStr = now.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  const timeStr = now.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
  document.getElementById('greeting').textContent = `${greet}, Jonno.`;
  document.getElementById('dateline').textContent = `${dateStr} · ${timeStr}`;
  document.getElementById('footer').textContent   = `briefing · ${dateStr} · ${timeStr}`;

  fetchWeather();
  setBar(20);

  initCarousel();
  renderGolf();
  setBar(35);

  // Make all sections visible with stagger
  const sections = document.querySelectorAll('.section');
  sections.forEach((s, i) => setTimeout(() => s.classList.add('visible'), i * 80));

  const data  = await getServerData();
  setBar(90);

  // Update GBPUSD rate from live data
  const fxData = data.prices?.['FX_GBPUSD'];
  if (fxData?.price) GBPUSD = fxData.price;

  const empty = { price: null, change: null, currency: '' };
  renderPortfolio(Object.fromEntries(Object.keys(PORTFOLIO).map(n => {
    const d = data.prices[n] || empty;
    // VUSA.L is USD-denominated; force currency so toGBP() converts correctly
    if (n === 'US 500') return [n, { ...d, currency: 'USD' }];
    return [n, d];
  })));
  renderIndices(data.prices || {});
  renderMovers(data.prices || {});
  buildTicker(data.prices || {});
  renderFPLTeam(data.fplTeam || null);
  renderNews(data.news || {});
  renderFixtures((data.fixtures || []).map(f => {
    const dt  = new Date(f.kickoff);
    const day = dt.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
    const tm  = dt.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
    return { ...f, time: `${day} · ${tm}` };
  }));

  doneBar();
}

init();
</script>
