<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Briefing</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: #0b0f1a;
  color: #e2e8f0;
  min-height: 100vh;
  padding: 40px 32px 60px;
  max-width: 1200px;
  margin: 0 auto;
}

.header { margin-bottom: 40px; }
.greeting { font-size: 30px; font-weight: 700; color: #f8fafc; letter-spacing: -0.5px; }
.dateline { font-size: 14px; color: #475569; margin-top: 4px; }

.section { margin-top: 36px; }
.section-label {
  font-size: 10px; font-weight: 700; letter-spacing: 0.12em;
  text-transform: uppercase; color: #334155; margin-bottom: 14px;
}

.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.card {
  background: #141b2d; border: 1px solid #1e2d45;
  border-radius: 14px; padding: 18px 20px; transition: border-color 0.15s;
}
.card:hover { border-color: #2d4a6e; }
.label { font-size: 12px; color: #475569; font-weight: 500; margin-bottom: 8px; }
.value { font-size: 22px; font-weight: 600; color: #f1f5f9; font-variant-numeric: tabular-nums; }
.holding { font-size: 13px; color: #64748b; margin-top: 4px; font-variant-numeric: tabular-nums; }
.up { color: #22c55e; } .down { color: #ef4444; }
.change { font-size: 13px; font-weight: 500; margin-top: 5px; }
.total { font-size: 13px; color: #475569; margin-top: 14px; }
.total-val { color: #f1f5f9; font-weight: 600; font-size: 18px; margin-left: 6px; }
.total-daily { font-size: 14px; font-weight: 500; margin-left: 8px; }

.fixtures-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; margin-top: 14px; }
.fixture { background: #141b2d; border: 1px solid #1e2d45; border-radius: 12px; padding: 14px 18px; }
.fixture.chelsea { border-color: #1d4ed8; background: rgba(29,78,216,0.07); }
.fix-meta { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; }
.gw {
  font-size: 10px; font-weight: 700; color: #3b82f6;
  background: rgba(59,130,246,0.1); padding: 2px 7px; border-radius: 20px;
}
.fix-time { font-size: 12px; color: #475569; }
.fix-teams { font-size: 14px; color: #cbd5e1; font-weight: 500; }
.fix-teams em { font-style: normal; color: #475569; margin: 0 5px; font-size: 12px; }

.company-card {
  background: #141b2d; border: 1px solid #1e2d45;
  border-left: 3px solid #3b82f6; border-radius: 14px; padding: 24px 28px;
}
.company-tag {
  display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: 0.1em;
  text-transform: uppercase; color: #3b82f6; background: rgba(59,130,246,0.1);
  padding: 3px 10px; border-radius: 20px; margin-bottom: 12px;
}
.company-name { font-size: 24px; font-weight: 700; color: #f8fafc; margin-bottom: 10px; }
.company-what { font-size: 14px; color: #cbd5e1; line-height: 1.6; margin-bottom: 8px; }
.company-why { font-size: 13.5px; color: #64748b; line-height: 1.6; margin-bottom: 16px; font-style: italic; }
.company-link { font-size: 13px; color: #3b82f6; text-decoration: none; }
.company-link:hover { color: #93c5fd; }

.news-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; margin-top: 14px; }
.news-col { background: #141b2d; border: 1px solid #1e2d45; border-radius: 14px; padding: 22px; }
.col-title {
  font-size: 11px; font-weight: 700; letter-spacing: 0.1em;
  text-transform: uppercase; color: #3b82f6; margin-bottom: 16px;
}
.story {
  display: block; padding: 9px 0; border-bottom: 1px solid #1e2d45;
  text-decoration: none; color: #94a3b8; font-size: 13.5px; line-height: 1.45; transition: color 0.15s;
}
.story:last-child { border-bottom: none; padding-bottom: 0; }
.story:first-child { padding-top: 0; }
.story:hover { color: #f1f5f9; }
.empty { color: #334155; font-size: 13px; }

.skeleton { background: #1e2d45; border-radius: 6px; animation: pulse 1.5s ease-in-out infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
.skel-card { height: 90px; border-radius: 14px; }

.footer { margin-top: 48px; font-size: 12px; color: #1e2d45; text-align: center; }

@media (max-width: 600px) {
  body { padding: 24px 16px 40px; }
  .greeting { font-size: 24px; }
}
</style>
</head>

// ── Helpers ───────────────────────────────────────────────────────────────────

function toGBP(price, currency) {
  if (price == null) return null;
  return currency === "GBp" ? price / 100 : price;
}

function fmtPrice(price, currency) {
  if (price == null) return "—";
  const p = toGBP(price, currency);
  if (p > 10000) return p.toLocaleString("en-GB", { maximumFractionDigits: 0 });
  if (p > 10)    return "£" + p.toLocaleString("en-GB", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  return "£" + p.toFixed(4);
}

function fmtChange(change) {
  if (change == null) return "";
  const cls   = change >= 0 ? "up" : "down";
  const arrow = change >= 0 ? "▲" : "▼";
  const sign  = change >= 0 ? "+" : "";
  return `<div class="change ${cls}">${arrow} ${sign}${change.toFixed(2)}%</div>`;
}

function getCompanyOfDay() {
  const start  = new Date(new Date().getFullYear(), 0, 0);
  const dayNum = Math.floor((Date.now() - start) / 86400000);
  return COMPANIES[dayNum % COMPANIES.length];
}

// ── Data fetching ─────────────────────────────────────────────────────────────

async function fetchPrice(ticker) {
  const url = `https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(ticker)}?interval=1d&range=2d`;
  const urls = [url, `https://corsproxy.io/?${encodeURIComponent(url)}`];
  for (const u of urls) {
    try {
      const res  = await fetch(u);
      const data = await res.json();
      const result   = data.chart.result[0];
      const currency = result.meta.currency || "";
      const closes   = result.indicators.quote[0].close.filter(c => c != null);
      if (closes.length >= 2) {
        const change = ((closes.at(-1) - closes.at(-2)) / closes.at(-2)) * 100;
        return { price: closes.at(-1), change, currency };
      }
      if (closes.length === 1) return { price: closes[0], change: 0, currency };
    } catch (_) {}
  }
  return { price: null, change: null, currency: "" };
}

async function fetchFeed(rssUrl, limit) {
  const api = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssUrl)}&count=${limit}`;
  try {
    const res  = await fetch(api);
    const data = await res.json();
    if (data.status === "ok") return data.items.map(i => ({ title: i.title, link: i.link }));
  } catch (_) {}
  return [];
}

async function fetchFixtures() {
  const proxy = u => `https://corsproxy.io/?${encodeURIComponent(u)}`;
  try {
    const [bsRes, fixRes] = await Promise.all([
      fetch(proxy("https://fantasy.premierleague.com/api/bootstrap-static/")),
      fetch(proxy("https://fantasy.premierleague.com/api/fixtures/?future=1")),
    ]);
    const bootstrap = await bsRes.json();
    const allFix    = await fixRes.json();

    const teams     = Object.fromEntries(bootstrap.teams.map(t => [t.id, t.name]));
    const chelseaId = bootstrap.teams.find(t => t.name.includes("Chelsea"))?.id;
    const topNames  = new Set(["Arsenal","Manchester City","Liverpool","Manchester United",
                               "Chelsea","Tottenham Hotspur","Newcastle United","Aston Villa"]);
    const topIds    = new Set(bootstrap.teams.filter(t => topNames.has(t.name)).map(t => t.id));

    const upcoming = allFix
      .filter(f => !f.finished && f.kickoff_time)
      .sort((a, b) => a.kickoff_time.localeCompare(b.kickoff_time));

    const chelseaFix = upcoming.find(f => chelseaId && (f.team_a === chelseaId || f.team_h === chelseaId));
    const topFixes   = upcoming
      .filter(f => f !== chelseaFix && topIds.has(f.team_a) && topIds.has(f.team_h))
      .slice(0, 3);

    return [chelseaFix, ...topFixes].filter(Boolean).map(f => {
      const dt  = new Date(f.kickoff_time);
      const day = dt.toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" });
      const tm  = dt.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
      return {
        home: teams[f.team_h] || "?", away: teams[f.team_a] || "?",
        time: `${day} · ${tm}`, gw: f.event,
        chelsea: !!(chelseaId && (f.team_h === chelseaId || f.team_a === chelseaId)),
      };
    });
  } catch (_) { return []; }
}

// ── Rendering ─────────────────────────────────────────────────────────────────

function priceCard(name, data, units) {
  const { price, change, currency } = data;
  const gbp = toGBP(price, currency);
  const holdingHtml = (units && gbp) ? `<div class="holding">£${(units * gbp).toLocaleString("en-GB", { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</div>` : "";
  return `<div class="card">
  <div class="label">${name}</div>
  <div class="value">${fmtPrice(price, currency)}</div>
  ${holdingHtml}
  ${fmtChange(change)}
</div>`;
}

function renderPortfolio(portfolio) {
  document.getElementById("portfolio").innerHTML =
    Object.entries(portfolio).map(([n, d]) => priceCard(n, d, UNITS[n])).join("");

  let total = 0, daily = 0;
  for (const [name, data] of Object.entries(portfolio)) {
    const gbp = toGBP(data.price, data.currency);
    const u   = UNITS[name] || 0;
    if (gbp && u) { const val = gbp * u; total += val; daily += val * (data.change || 0) / 100; }
  }
  if (total) {
    const color = daily >= 0 ? "#22c55e" : "#ef4444";
    const sign  = daily >= 0 ? "+" : "";
    document.getElementById("portfolio-total").innerHTML =
      `<div class="total">Total <span class="total-val">£${total.toLocaleString("en-GB", { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</span>` +
      `<span class="total-daily" style="color:${color}">${sign}£${Math.abs(daily).toLocaleString("en-GB", { minimumFractionDigits: 2, maximumFractionDigits: 2 })} today</span></div>`;
  }
}

function renderMarkets(indices) {
  document.getElementById("markets").innerHTML =
    Object.entries(indices).map(([n, d]) => priceCard(n, d, null)).join("");
}

function renderFixtures(fixtures) {
  if (!fixtures.length) { document.getElementById("fixtures").innerHTML = '<p class="empty">Fixtures unavailable</p>'; return; }
  document.getElementById("fixtures").innerHTML = fixtures.map(f => `
<div class="fixture${f.chelsea ? " chelsea" : ""}">
  <div class="fix-meta">${f.gw ? `<span class="gw">GW${f.gw}</span>` : ""}<span class="fix-time">${f.time}</span></div>
  <div class="fix-teams">${f.home} <em>vs</em> ${f.away}</div>
</div>`).join("");
}

function renderCompany() {
  const c = getCompanyOfDay();
  document.getElementById("company").innerHTML = `
<div class="company-card">
  <div class="company-tag">${c.tag}</div>
  <div class="company-name">${c.name}</div>
  <div class="company-what">${c.what}</div>
  <div class="company-why">${c.why}</div>
  <a class="company-link" href="https://${c.url}" target="_blank" rel="noopener">${c.url} →</a>
</div>`;
}

function renderNews(allNews) {
  document.getElementById("news").innerHTML = Object.entries(allNews).map(([name, items]) => {
    if (!items.length) return `<div class="news-col"><div class="col-title">${name}</div><p class="empty">Unavailable</p></div>`;
    const stories = items.map(i => `<a class="story" href="${i.link}" target="_blank" rel="noopener">${i.title}</a>`).join("");
    return `<div class="news-col"><div class="col-title">${name}</div>${stories}</div>`;
  }).join("");
}

// ── Init ──────────────────────────────────────────────────────────────────────

async function init() {
  // Header
  const now    = new Date();
  const hour   = now.getHours();
  const greet  = hour < 12 ? "Good morning" : hour < 17 ? "Good afternoon" : "Good evening";
  const dateStr = now.toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
  const timeStr = now.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
  document.getElementById("greeting").textContent  = `${greet}, Jonno.`;
  document.getElementById("dateline").textContent  = `${dateStr} · Updated at ${timeStr}`;
  document.getElementById("footer").textContent    = `briefing · ${dateStr} · ${timeStr}`;

  // Company (no network needed)
  renderCompany();

  // All network fetches in parallel
  const portfolioPrices = Object.entries(PORTFOLIO).map(([name, ticker]) =>
    fetchPrice(ticker).then(data => [name, data])
  );
  const indexPrices = Object.entries(INDICES).map(([name, ticker]) =>
    fetchPrice(ticker).then(data => [name, data])
  );
  const feedFetches = Object.entries(FEEDS).map(([name, [url, limit]]) =>
    fetchFeed(url, limit).then(items => [name, items])
  );

  const [portfolioEntries, indexEntries, newsEntries, fixtures] = await Promise.all([
    Promise.all(portfolioPrices),
    Promise.all(indexPrices),
    Promise.all(feedFetches),
    fetchFixtures(),
  ]);

  renderPortfolio(Object.fromEntries(portfolioEntries));
  renderMarkets(Object.fromEntries(indexEntries));
  renderNews(Object.fromEntries(newsEntries));
  renderFixtures(fixtures);

  // Update timestamp
