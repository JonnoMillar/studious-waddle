name: Refresh GolfNow Tee Times

on:
  schedule:
    - cron: '0 17 * * 4'   # Thursday 5pm UTC (6pm BST) — ready for weekend planning
    - cron: '0 6  * * 6'   # Saturday 6am UTC (7am BST) — catch same-day deals
  workflow_dispatch:
    inputs:
      dump_raw:
        description: 'Dump raw API response to debug_raw.json (for offline debugging)'
        type: boolean
        default: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-golfnow-v1

      - name: Install dependencies
        run: |
          pip install -r golfnow-mcp/requirements.txt -q
          playwright install chromium --with-deps

      - name: Check BROWSER_AUTH is set
        run: |
          if [ -z "$BROWSER_AUTH" ]; then
            echo "ERROR: BROWSER_AUTH secret is not set. Go to repo Settings → Secrets and variables → Actions and add BROWSER_AUTH."
            exit 1
          fi
          echo "BROWSER_AUTH is set (${#BROWSER_AUTH} chars)"
        env:
          BROWSER_AUTH: ${{ secrets.BROWSER_AUTH }}

      - name: Run scraper
        env:
          BROWSER_AUTH: ${{ secrets.BROWSER_AUTH }}
          PYTHONUNBUFFERED: "1"
        run: |
          if [ "${{ inputs.dump_raw }}" = "true" ]; then
            python3 -u golfnow-mcp/run_scraper.py --dump
          else
            python3 -u golfnow-mcp/run_scraper.py > api/golf-cache.json
          fi

      - name: Commit and push
        run: |
          git config user.email "golf-bot@briefing.local"
          git config user.name "Golf Bot"
          git add api/golf-cache.json
          [ -f golfnow-mcp/debug_raw.json ] && git add golfnow-mcp/debug_raw.json
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: refresh GolfNow tee time cache"
          git pull --rebase origin ${{ github.ref_name }}
          git push origin ${{ github.ref_name }}
